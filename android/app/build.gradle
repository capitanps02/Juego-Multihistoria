plugins { id 'com.android.application' }
dependencies { implementation 'androidx.webkit:webkit:1.12.1' }

android { namespace 'com.multihistoria'; compileSdk 35
    defaultConfig { applicationId 'com.multihistoria'; minSdk 23; targetSdk 35; versionCode 1; versionName '0.8.0'; testInstrumentationRunner 'com.multihistoria.OfflineProbe' }
    buildTypes { release { minifyEnabled false; shrinkResources false; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}
