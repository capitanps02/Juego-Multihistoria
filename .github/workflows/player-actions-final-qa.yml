name: Player Actions final QA

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run A6 final focused suite
        run: npm run test:player-actions-final

  zero_action_equivalence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          path: candidate

      - name: Checkout pre-Player-Actions baseline
        uses: actions/checkout@v4
        with:
          ref: 2cc068cb705214ba827677ab02d8d1668e8677ec
          path: baseline

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build baseline
        working-directory: baseline
        run: |
          npm ci
          npm run build

      - name: Build candidate
        working-directory: candidate
        run: |
          npm ci
          npm run build

      - name: Compare zero-action careers
        run: node candidate/scripts/test-player-actions-zero-equivalence.mjs baseline candidate


  upstream_zero_action:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: A3
            candidate_ref: 75be938bbe4a6f7a01ef45a5078a6bfa6d77262d
          - label: A4
            candidate_ref: a4/player-actions-ui
          - label: A5
            candidate_ref: a5/player-actions-content
    steps:
      - name: Checkout A6 QA harness
        uses: actions/checkout@v4
        with:
          path: qa

      - name: Checkout pre-Player-Actions baseline
        uses: actions/checkout@v4
        with:
          ref: 2cc068cb705214ba827677ab02d8d1668e8677ec
          path: baseline

      - name: Checkout ${{ matrix.label }} candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.candidate_ref }}
          path: candidate

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build baseline
        working-directory: baseline
        run: |
          npm ci
          npm run build

      - name: Build candidate
        working-directory: candidate
        run: |
          npm ci
          npm run build

      - name: Compare zero-action careers for ${{ matrix.label }}
        run: node qa/scripts/test-player-actions-zero-equivalence.mjs baseline candidate


  backend_stress:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build candidate
        run: npm run build

      - name: Run 20-seed backend stress
        run: node scripts/stress-player-actions-backend.mjs


  performance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build candidate
        run: npm run build

      - name: Run informational performance probe
        run: node scripts/bench-player-actions.mjs


  a5_backend_stress:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout A6 QA harness
        uses: actions/checkout@v4
        with:
          path: qa

      - name: Checkout A5 candidate
        uses: actions/checkout@v4
        with:
          ref: a5/player-actions-content
          path: candidate

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build A5 candidate
        working-directory: candidate
        run: |
          npm ci
          npm run build

      - name: Run 20-seed A5 slice stress
        run: node qa/scripts/stress-player-actions-backend.mjs candidate

      - name: Enforce A5 anti-grind release budget
        run: node qa/scripts/test-player-actions-balance-release.mjs candidate


  a5_market_exploit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout A6 QA harness
        uses: actions/checkout@v4
        with:
          path: qa

      - name: Checkout A5 candidate
        uses: actions/checkout@v4
        with:
          ref: a5/player-actions-content
          path: candidate

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build A5 candidate
        working-directory: candidate
        run: |
          npm ci
          npm run build

      - name: Run transfer-request market exploit probe
        run: node qa/scripts/stress-player-actions-market.mjs candidate


  public_target_contract_a2:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout A6 QA harness
        uses: actions/checkout@v4
        with:
          path: qa

      - name: Checkout PR 806 merged candidate
        uses: actions/checkout@v4
        with:
          ref: refs/pull/806/merge
          path: candidate

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build candidate
        working-directory: candidate
        run: |
          npm ci
          npm run build

      - name: Run public target contract gate
        run: node qa/scripts/test-player-actions-public-target-contract.mjs candidate

      - name: Zero-action after public target adapter
        run: |
          git clone --depth 1 https://github.com/capitanps02/Juego-Multihistoria.git baseline
          cd baseline
          git fetch --depth 1 origin 2cc068cb705214ba827677ab02d8d1668e8677ec
          git checkout 2cc068cb705214ba827677ab02d8d1668e8677ec
          npm ci
          npm run build
          cd ..
          node qa/scripts/test-player-actions-zero-equivalence.mjs baseline candidate

  public_target_contract_a4:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout A6 QA harness
        uses: actions/checkout@v4
        with:
          path: qa

      - name: Checkout PR 804 merged candidate
        uses: actions/checkout@v4
        with:
          ref: refs/pull/804/merge
          path: candidate

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build PlayCanvas candidate
        working-directory: candidate
        run: |
          npm ci
          npm run build:playcanvas

      - name: Verify committed PlayCanvas artifacts are current
        working-directory: candidate
        run: git diff --exit-code -- playcanvas/multihistoria.js playcanvas/manifest.json web/assets.json

      - name: Run A2 target + A4 UI contract
        working-directory: candidate
        run: |
          node --test scripts/test-player-actions-session.mjs scripts/test-player-actions-ui-contract.mjs

      - name: Run independent A6 target contract
        run: node qa/scripts/test-player-actions-public-target-contract.mjs candidate

      - name: Run PlayCanvas regression
        working-directory: candidate
        run: node --test scripts/test-playcanvas.mjs scripts/test-t55-a19-ui.mjs


  mobile_e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout A6 QA harness
        uses: actions/checkout@v4
        with:
          path: qa

      - name: Checkout latest A4 candidate
        uses: actions/checkout@v4
        with:
          ref: a4/player-actions-ui
          path: candidate

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install candidate dependencies
        working-directory: candidate
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Build preview and PlayCanvas package
        working-directory: candidate
        run: npm run build:playcanvas

      - name: Copy A6 mobile E2E harness
        run: cp qa/scripts/test-player-actions-mobile-e2e.mjs candidate/scripts/test-player-actions-mobile-e2e.mjs

      - name: Start preview server
        working-directory: candidate
        run: |
          PREVIEW_PORT=4173 node scripts/serve-preview.mjs > /tmp/multihistoria-preview.log 2>&1 &
          echo $! > /tmp/multihistoria-preview.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/multihistoria-preview.log
          exit 1

      - name: Run mobile Chromium E2E
        working-directory: candidate
        run: node scripts/test-player-actions-mobile-e2e.mjs http://127.0.0.1:4173

      - name: Show preview log on failure
        if: failure()
        run: cat /tmp/multihistoria-preview.log || true
