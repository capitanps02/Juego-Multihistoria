name: Player Actions browser freeze

on:
  pull_request:
    branches:
      - a6/player-actions-qa-base
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: player-actions-browser-freeze-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  INTEGRATED_REF: a6/player-actions-release-qa

jobs:
  browser_e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout browser harness
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: qa

      - name: Checkout release candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.INTEGRATED_REF }}
          path: candidate

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install browser dependencies
        working-directory: candidate
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Build candidate
        working-directory: candidate
        run: npm run build:playcanvas

      - name: Copy browser harnesses
        run: |
          cp qa/scripts/test-player-actions-mobile-e2e.mjs candidate/scripts/test-player-actions-mobile-e2e.mjs
          cp qa/scripts/test-player-actions-preview-e2e.mjs candidate/scripts/test-player-actions-preview-e2e.mjs

      - name: Start preview server
        working-directory: candidate
        run: |
          PREVIEW_PORT=4173 node scripts/serve-preview.mjs > /tmp/multihistoria-preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/multihistoria-preview.log
          exit 1

      - name: Run mobile Chromium E2E
        working-directory: candidate
        run: node scripts/test-player-actions-mobile-e2e.mjs http://127.0.0.1:4173

      - name: Run classic preview Chromium E2E
        working-directory: candidate
        run: node scripts/test-player-actions-preview-e2e.mjs http://127.0.0.1:4173
