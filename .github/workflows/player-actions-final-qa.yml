name: Player Actions final QA

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run A6 final focused suite
        run: npm run test:player-actions-final

  zero_action_equivalence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          path: candidate

      - name: Checkout pre-Player-Actions baseline
        uses: actions/checkout@v4
        with:
          ref: 2cc068cb705214ba827677ab02d8d1668e8677ec
          path: baseline

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build baseline
        working-directory: baseline
        run: |
          npm ci
          npm run build

      - name: Build candidate
        working-directory: candidate
        run: |
          npm ci
          npm run build

      - name: Compare zero-action careers
        run: node candidate/scripts/test-player-actions-zero-equivalence.mjs baseline candidate
