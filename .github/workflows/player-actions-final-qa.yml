name: Player Actions final QA

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run A6 final focused suite
        run: npm run test:player-actions-final

  zero_action_equivalence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          path: candidate

      - name: Checkout pre-Player-Actions baseline
        uses: actions/checkout@v4
        with:
          ref: 2cc068cb705214ba827677ab02d8d1668e8677ec
          path: baseline

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build baseline
        working-directory: baseline
        run: |
          npm ci
          npm run build

      - name: Build candidate
        working-directory: candidate
        run: |
          npm ci
          npm run build

      - name: Compare zero-action careers
        run: node candidate/scripts/test-player-actions-zero-equivalence.mjs baseline candidate


  upstream_zero_action:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: A3
            candidate_ref: 75be938bbe4a6f7a01ef45a5078a6bfa6d77262d
          - label: A4
            candidate_ref: a4/player-actions-ui
          - label: A5
            candidate_ref: a5/player-actions-content
    steps:
      - name: Checkout A6 QA harness
        uses: actions/checkout@v4
        with:
          path: qa

      - name: Checkout pre-Player-Actions baseline
        uses: actions/checkout@v4
        with:
          ref: 2cc068cb705214ba827677ab02d8d1668e8677ec
          path: baseline

      - name: Checkout ${{ matrix.label }} candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.candidate_ref }}
          path: candidate

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build baseline
        working-directory: baseline
        run: |
          npm ci
          npm run build

      - name: Build candidate
        working-directory: candidate
        run: |
          npm ci
          npm run build

      - name: Compare zero-action careers for ${{ matrix.label }}
        run: node qa/scripts/test-player-actions-zero-equivalence.mjs baseline candidate


  backend_stress:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build candidate
        run: npm run build

      - name: Run 20-seed backend stress
        run: node scripts/stress-player-actions-backend.mjs


  performance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build candidate
        run: npm run build

      - name: Run informational performance probe
        run: node scripts/bench-player-actions.mjs


  a5_backend_stress:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout A6 QA harness
        uses: actions/checkout@v4
        with:
          path: qa

      - name: Checkout A5 candidate
        uses: actions/checkout@v4
        with:
          ref: a5/player-actions-content
          path: candidate

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build A5 candidate
        working-directory: candidate
        run: |
          npm ci
          npm run build

      - name: Run 20-seed A5 slice stress
        run: node qa/scripts/stress-player-actions-backend.mjs candidate


  a5_market_exploit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout A6 QA harness
        uses: actions/checkout@v4
        with:
          path: qa

      - name: Checkout A5 candidate
        uses: actions/checkout@v4
        with:
          ref: a5/player-actions-content
          path: candidate

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build A5 candidate
        working-directory: candidate
        run: |
          npm ci
          npm run build

      - name: Run transfer-request market exploit probe
        run: node qa/scripts/stress-player-actions-market.mjs candidate
