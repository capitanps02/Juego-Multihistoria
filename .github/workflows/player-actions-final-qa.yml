name: Player Actions safety freeze

on:
  pull_request:
    branches:
      - a6/player-actions-qa-base
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: player-actions-safety-freeze-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BASELINE_SHA: 2cc068cb705214ba827677ab02d8d1668e8677ec
  INTEGRATED_REF: a6/player-actions-release-qa

jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout A6 harness
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: qa

      - name: Checkout release candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.INTEGRATED_REF }}
          path: candidate

      - name: Checkout baseline
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BASELINE_SHA }}
          path: baseline

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build candidate
        working-directory: candidate
        run: |
          npm ci
          npm run build

      - name: Core suite
        working-directory: candidate
        run: timeout 300s node --test scripts/test-player-actions-core.mjs

      - name: Session suite
        working-directory: candidate
        run: timeout 300s node --test scripts/test-player-actions-session.mjs

      - name: Narrative bridge suite
        working-directory: candidate
        run: timeout 300s node --test scripts/test-player-actions-narrative-bridge.mjs

      - name: Content suite
        working-directory: candidate
        run: timeout 300s node --test scripts/test-player-actions-content.mjs

      - name: UI contract suite
        working-directory: candidate
        run: timeout 300s node --test scripts/test-player-actions-ui-contract.mjs

      - name: Auto-simulation regression
        working-directory: candidate
        run: timeout 300s node --test scripts/test-t55-auto-simulation.mjs

      - name: Persistence regression
        working-directory: candidate
        run: timeout 300s node --test scripts/test-persistence.mjs

      - name: Run all A6 cross-system probes
        run: |
          cp qa/scripts/test-player-actions-final.mjs candidate/scripts/a6-player-actions-final.mjs
          cd candidate
          timeout 300s node --test scripts/a6-player-actions-final.mjs

      - name: Public target contract
        run: node qa/scripts/test-player-actions-public-target-contract.mjs candidate

      - name: Build baseline
        working-directory: baseline
        run: |
          npm ci
          npm run build

      - name: Final zero-action equivalence
        run: timeout 600s node qa/scripts/test-player-actions-zero-equivalence.mjs baseline candidate

      - name: PlayCanvas build and regression
        working-directory: candidate
        run: |
          npm run build:playcanvas
          node --test scripts/test-playcanvas.mjs scripts/test-t55-a19-ui.mjs
