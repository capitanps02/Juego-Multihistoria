name: T51 30-34 temporary validation

on:
  push:
    branches: [t51/canon-30-34]

jobs:
  validate-t51-30-34:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: T5.1 30-34 reconciliation tests
        run: npm run test:t51
