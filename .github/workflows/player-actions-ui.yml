name: Player Actions A4 UI

permissions:
  contents: write

on:
  pull_request:
    branches:
      - main
      - a2/player-actions-session
    paths:
      - 'preview/**'
      - 'web/game-ui.js'
      - 'web/game-ui.css'
      - 'src/player-actions/**'
      - 'src/session/game-session.ts'
      - 'scripts/test-player-actions-ui-contract.mjs'
      - 'scripts/test-player-actions-session.mjs'
      - 'scripts/test-playcanvas.mjs'
      - 'scripts/build-playcanvas.mjs'
      - 'package.json'
      - '.github/workflows/player-actions-ui.yml'
  workflow_dispatch:

jobs:
  a4-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Parse UI sources
        run: |
          node --check preview/app.js
          node --check web/game-ui.js
      - name: Build PlayCanvas package
        run: npm run build:playcanvas
      - name: Player Actions session + UI contract
        run: node --test scripts/test-player-actions-session.mjs scripts/test-player-actions-ui-contract.mjs
      - name: PlayCanvas regression
        run: node --test scripts/test-playcanvas.mjs scripts/test-t55-a19-ui.mjs
      - name: Commit regenerated PlayCanvas package
        if: github.event_name == 'pull_request' && github.head_ref == 'a4/player-actions-ui'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playcanvas/multihistoria.js playcanvas/manifest.json web/assets.json
          if ! git diff --cached --quiet; then
            git commit -m "A4: regenerate PlayCanvas package"
            git push origin HEAD:${{ github.head_ref }}
          fi
