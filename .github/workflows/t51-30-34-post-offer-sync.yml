name: T5.1 30-34 post-offer sync

on:
  push:
    branches: [t51/canon-30-34]
    paths:
      - '.github/workflows/t51-30-34-post-offer-sync.yml'

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: t51/canon-30-34
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Refresh post-offer baseline evidence
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const MAIN_SHA = '24c176474bb17a8c271f52bac7bf41e08a929c72';
          const TARGET = '163b582315bb8d08ac4a03f13719b89c0d76c130a2b33f3e32fa53af5474d8dc';
          const runId = Number(process.env.RUN_ID);

          const handoffPath = 'analysis/T5.1/canon-30-34-migration-handoff.json';
          const handoff = JSON.parse(fs.readFileSync(handoffPath, 'utf8'));
          handoff.sourceMainSha = MAIN_SHA;
          handoff.observedTargetContentIdentity = TARGET;
          handoff.targetIdentityEvidence.workflowRun = runId;
          handoff.targetIdentityEvidence.source = 'T5.1 30-34 post-offer focused validation / runtime contentIdentity(EVENTS)';
          handoff.consumer.targetFreezeRequiredBeforeRouteRegistration = true;
          handoff.consumer.targetFreezeFixture = `qa/fixtures/t5.1/post-t51-sources/${TARGET}.json`;
          if (!handoff.requiredCurrentRouteAssertions.includes('target identity is frozen as post-T5.1 source evidence before the B1a-to-target route is registered')) {
            handoff.requiredCurrentRouteAssertions.push('target identity is frozen as post-T5.1 source evidence before the B1a-to-target route is registered');
          }
          fs.writeFileSync(handoffPath, JSON.stringify(handoff, null, 2) + '\n');

          const auditPath = 'analysis/T5.1/canon-30-34.json';
          const audit = JSON.parse(fs.readFileSync(auditPath, 'utf8'));
          audit.integrationStatus.syncedBaselineMain = MAIN_SHA;
          audit.integrationStatus.offerSessionBridge = 'available_in_main';
          audit.integrationStatus.contentMigrationLineage = 'PRE_T51_to_T51_B1A_available_in_main';
          audit.integrationStatus.contentMigrationTargetFreeze = 'pending_post_t51_source_fixture';
          audit.integrationStatus.contentMigrationRoute = 'handoff_B1A_to_163b_freeze_and_registration_pending';
          audit.integrationStatus.targetContentIdentity = TARGET;
          audit.integrationStatus.targetedT51Run = runId;
          audit.integrationStatus.targetedT51Result = 'pending_current_run';
          audit.integrationStatus.temporaryValidationWorkflowRemoved = false;
          const migrationDep = audit.globalDependencies.find(dep => dep.id === 'DEP_T51_EVENT_ID_MIGRATION');
          if (migrationDep) migrationDep.description = 'Shared multigeneration contentIdentity migration architecture exists in main. For this 30–34 batch, integration must first freeze active target 163b5823… as post-T5.1 source evidence and then register/certify the unique T51_B1A -> target edge with the 27 exact-ID distinct_scene mappings. Shifted IDs remain deferred.';
          fs.writeFileSync(auditPath, JSON.stringify(audit, null, 2) + '\n');

          const workstreamPath = 'project/workstreams/T51_CANON_30_34.md';
          let workstream = fs.readFileSync(workstreamPath, 'utf8');
          workstream = workstream.replace(/Baseline sincronizado: `main@[0-9a-f]+`\./, `Baseline sincronizado: \`main@${MAIN_SHA}\`.`);
          workstream = workstream.replace(
            '- `DEP_T51_EVENT_ID_MIGRATION`: handoff ejecutable listo; integración debe registrar y certificar la ruta global.',
            '- `DEP_T51_EVENT_ID_MIGRATION`: el lineage global existe; integración debe congelar primero `163b5823…` como evidencia post-T5.1 y registrar/certificar después el edge único `T51_B1A → 163b5823…` con los 27 `distinct_scene`.'
          );
          if (!workstream.includes('target freeze `163b5823')) {
            workstream = workstream.replace(
              'No se anticipan mappings para futuros batches:',
              'El checker compartido exige además un **target freeze `163b5823…`** en `qa/fixtures/t5.1/post-t51-sources/` antes del registro del edge. Ese freeze y el registro pertenecen a integración, no a este workstream.\n\nNo se anticipan mappings para futuros batches:'
            );
          }
          const marker = 'Evidencia dirigida:\n';
          const line = `\n- run \`${runId}\`: validación post-offer en curso; exige 29/29 focalizado, offer/session bridge verde y checker detenido únicamente por el freeze del target.\n`;
          if (!workstream.includes(`run \`${runId}\``)) workstream = workstream.replace(marker, marker + line);
          fs.writeFileSync(workstreamPath, workstream);
          NODE
      - run: npm ci
      - name: Validate focused T5.1 30-34 suite
        run: npm run audit:t51 && node --test scripts/test-t51.mjs scripts/test-t51-30-34-trigger.mjs scripts/test-t51-30-34-readiness.mjs scripts/test-t51-30-34-migration-handoff.mjs
      - name: Validate inherited offer/session bridge
        run: npm run build && node --test scripts/test-t51-offer-bridge.mjs
      - name: Characterize migration boundary
        run: |
          set +e
          node scripts/check-t51-content-migration-route.mjs > /tmp/migration-check.log 2>&1
          code=$?
          set -e
          cat /tmp/migration-check.log
          test "$code" -ne 0
          grep -q '163b582315bb8d08ac4a03f13719b89c0d76c130a2b33f3e32fa53af5474d8dc' /tmp/migration-check.log
          grep -q 'has no frozen source evidence' /tmp/migration-check.log
      - name: Finalize evidence and remove temporary workflow
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const runId = Number(process.env.RUN_ID);
          const auditPath = 'analysis/T5.1/canon-30-34.json';
          const audit = JSON.parse(fs.readFileSync(auditPath, 'utf8'));
          audit.integrationStatus.targetedT51Run = runId;
          audit.integrationStatus.targetedT51Result = '29/29_focused_pass';
          audit.integrationStatus.offerSessionBridgeValidation = 'pass';
          audit.integrationStatus.contentMigrationChecker = 'expected_missing_target_freeze_before_route_registration';
          audit.integrationStatus.temporaryValidationWorkflowRemoved = true;
          fs.writeFileSync(auditPath, JSON.stringify(audit, null, 2) + '\n');

          const workstreamPath = 'project/workstreams/T51_CANON_30_34.md';
          let workstream = fs.readFileSync(workstreamPath, 'utf8');
          workstream = workstream.replace(
            `- run \`${runId}\`: validación post-offer en curso; exige 29/29 focalizado, offer/session bridge verde y checker detenido únicamente por el freeze del target.`,
            `- run \`${runId}\`: **29/29 PASS** focalizado; **offer/session bridge PASS**; checker de migración reproduce únicamente la ausencia esperada del freeze \`163b5823…\` antes del registro de ruta.`
          );
          fs.writeFileSync(workstreamPath, workstream);
          NODE
          rm .github/workflows/t51-30-34-post-offer-sync.yml
      - name: Commit validated post-offer evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/T5.1/canon-30-34-migration-handoff.json analysis/T5.1/canon-30-34.json project/workstreams/T51_CANON_30_34.md .github/workflows/t51-30-34-post-offer-sync.yml
          git commit -m 'audit(t51): refresh 30-34 evidence after offer bridge sync'
          git push origin HEAD:t51/canon-30-34
