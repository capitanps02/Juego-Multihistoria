name: T5.14 penalty context focused

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  penalty-context:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Penalty context regression
        run: node --test scripts/test-t514-penalty-context.mjs
