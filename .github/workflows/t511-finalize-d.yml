name: T5.11 finalize canonical D

on:
  push:
    branches:
      - integration/t511-23-26
    paths:
      - .github/workflows/t511-finalize-d.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/t511-23-26
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Adapt finalizer to multiline C-D mapping
        run: |
          python3 - <<'PY'
          from pathlib import Path

          migration = Path('src/session/content-migration.ts')
          body = migration.read_text()
          needle = 'legacyEventId: "EVT_23_EUR_001"'
          idx = body.find(needle)
          if idx < 0:
              raise SystemExit('EUR migration mapping id not found')
          start = body.rfind('      {', 0, idx)
          end_marker = '\n      }'
          end = body.find(end_marker, idx)
          if start < 0 or end < 0:
              raise SystemExit('EUR migration mapping boundaries not found')
          end += len(end_marker)
          eur_block = body[start:end]
          if 'canonicalEventId: "EVT_23_EUR_001"' not in eur_block:
              raise SystemExit('EUR canonical mapping boundary mismatch')
          prs_block = eur_block.replace('EVT_23_EUR_001', 'EVT_23_PRS_001')
          migration.write_text(body[:end] + ',\n' + prs_block + body[end:])

          finalizer = Path('scripts/finalize-t511-d.mjs')
          script = finalizer.read_text()
          start_marker = "{\n  const path = 'src/session/content-migration.ts';"
          next_marker = "\n\n{\n  const path = 'scripts/test-t51-t511-23-26.mjs';"
          start = script.find(start_marker)
          end = script.find(next_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('finalizer migration section not found')
          finalizer.write_text(script[:start] + script[end + 2:])
          PY
      - run: node scripts/finalize-t511-d.mjs
      - name: Commit final D candidate
        run: |
          git rm .github/workflows/t511-finalize-d.yml scripts/finalize-t511-d.mjs
          git config user.name "multihistoria-t511-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat(t511): finalize four-scene canonical D"
          git push origin HEAD:integration/t511-23-26
