name: Football Database V2 · Save versioning

on:
  push:
    branches:
      - db-a4/save-catalog-versioning
      - db-a4/save-catalog-versioning-regrounded
  pull_request:
    branches:
      - main
      - db-a3/runtime-football-catalog
      - db-a3/runtime-football-catalog-regrounded
    paths:
      - 'src/save/**'
      - 'src/core/types.ts'
      - 'src/content/initial-state.ts'
      - 'src/catalog/football/**'
      - 'src/player-actions/**'
      - 'src/simulation/**'
      - 'scripts/test-football-save-versioning.mjs'
      - 'scripts/test-football-catalog-save-version.mjs'
      - 'scripts/test-football-catalog-save-versioning.mjs'
      - 'scripts/test-football-save-versioning.mjs'
      - 'scripts/test-saves.mjs'
      - 'scripts/test-player-actions-session.mjs'
      - 'scripts/test-t536-t537-retirement.mjs'
      - 'scripts/test-offers.mjs'
      - 'scripts/test-t5-market-contract-authority.mjs'
      - 'scripts/test-t5-match-model.mjs'
      - 'package.json'
      - '.github/workflows/football-database-v2-save.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  save-versioning:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: DB-A4 save/version/migration suite
        run: npm run test:football-save
      - name: Football catalog integrity
        run: npm run test:football-catalog
      - name: Runtime/catalog regression
        run: npm run test:football-runtime
