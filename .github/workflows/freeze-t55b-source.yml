name: Freeze T5.5-B source

on:
  push:
    branches: [t51/canon-20-23]
    paths:
      - '.github/workflows/freeze-t55b-source.yml'

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: t51/canon-20-23
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build exact active catalog
        run: npm run build
      - name: Freeze active B generation
        run: node scripts/freeze-t51-active-source.mjs
      - name: Regenerate frozen-source registry
        run: node scripts/generate-t51-post-legacy-registry.mjs
      - name: Verify generated registry
        run: node scripts/generate-t51-post-legacy-registry.mjs --check
      - name: Commit B fixture and generated registry to feature branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa/fixtures/t5.1/post-t51-sources src/session/post-t51-legacy-registry.ts
          if git diff --cached --quiet; then
            echo "B generation already frozen and registry current"
            exit 0
          fi
          git commit -m "T5.5: freeze canonical 20-23 microbatch B source"
          git push origin HEAD:t51/canon-20-23
