name: T5.11 freeze active source

on:
  push:
    branches:
      - integration/t511-23-26

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/t511-23-26
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Freeze or verify active catalog and regenerate registry
        run: |
          set -euo pipefail
          ID=$(node --input-type=module - <<'NODE'
          import { EVENTS } from './dist/content/events/index.js';
          import { contentIdentity } from './dist/session/content-identity.js';
          console.log(await contentIdentity(EVENTS));
          NODE
          )
          echo "ACTIVE_IDENTITY=$ID"
          test "$ID" = "5d3fd71a8df42ed5b93fdde63ed386e9d776693addd62a30293dbecad7aa56d2"
          FIXTURE="qa/fixtures/t5.1/post-t51-sources/$ID.json"
          if [ -f "$FIXTURE" ]; then
            node scripts/freeze-t51-active-source.mjs --check
            node scripts/generate-t51-post-legacy-registry.mjs --check
          else
            node scripts/freeze-t51-active-source.mjs
            node scripts/generate-t51-post-legacy-registry.mjs
          fi
      - name: Commit generated evidence when needed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa/fixtures/t5.1/post-t51-sources src/session/post-t51-legacy-registry.ts
          if git diff --cached --quiet; then
            echo "Generated evidence already current"
          else
            git commit -m "T5.11: freeze active content source evidence"
            git push origin HEAD:integration/t511-23-26
          fi
