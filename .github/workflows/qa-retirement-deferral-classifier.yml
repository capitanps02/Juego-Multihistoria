name: QA retirement deferral classifier
on:
  push:
    branches:
      - qa/harden-480-retirement-deferral
  pull_request:
    branches:
      - main
jobs:
  classifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test scripts/test-qa-retirement-deferral-classifier.mjs
