name: QA #61 post-merge final
on:
  push:
    branches:
      - qa/postmerge-61-final
  pull_request:
    branches:
      - main
jobs:
  retirement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test scripts/test-t5-retirement-authority-known-bug.mjs scripts/test-t5-retirement-save-known-bug.mjs scripts/test-t5-retirement-deferral-classifier.mjs
      - run: node scripts/qa-t5-sim.mjs
