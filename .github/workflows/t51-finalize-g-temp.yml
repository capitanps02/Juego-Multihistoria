name: T5.11 finalize G temp

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Materialize F-to-G route and migration tests
        run: node scripts/finalize-t511-prs-g-temp.mjs
      - run: npm run build
      - name: Focused PRS and migration tests
        run: node --test scripts/test-t51-prs-23-26.mjs scripts/test-t51-content-lineage.mjs scripts/test-t51-content-migration.mjs
      - name: Commit finalized migration files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/session/content-migration.ts scripts/test-t51-prs-23-26.mjs
          git commit -m "T5.11 PRS: add adjacent F-to-G migration"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
