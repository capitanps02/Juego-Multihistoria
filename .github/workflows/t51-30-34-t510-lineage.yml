name: T5.1 30-34 T5.10 lineage

on:
  push:
    branches: [t51/canon-30-34]
    paths:
      - '.github/workflows/t51-30-34-t510-lineage.yml'

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: t51/canon-30-34
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Discover lineage source and 30-34 target
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { EVENTS } from './dist/content/events/index.js';
          import { contentIdentity } from './dist/session/content-identity.js';
          import { CONTENT_MIGRATION_ROUTES, LEGACY_CONTENT_SOURCES, T51_T510_CONTENT_IDENTITY, findMigrationPath } from './dist/session/content-migration.js';
          import { PRE_T51_CONTENT_IDENTITY } from './dist/session/pre-t51-legacy-registry.js';

          const MAIN_SHA = 'de2af6b698d22343a1b7dadf63fb857ddeef5aec';
          const runId = Number(process.env.RUN_ID);
          const sourceIdentity = T51_T510_CONTENT_IDENTITY;
          const targetIdentity = await contentIdentity(EVENTS);
          if (!LEGACY_CONTENT_SOURCES[sourceIdentity]) throw new Error(`Latest upstream identity is not frozen: ${sourceIdentity}`);
          const upstreamPath = findMigrationPath(PRE_T51_CONTENT_IDENTITY, sourceIdentity, CONTENT_MIGRATION_ROUTES);
          if (!upstreamPath?.length) throw new Error(`No unique PRE_T51 -> ${sourceIdentity} path`);
          if (targetIdentity === sourceIdentity) throw new Error('30-34 branch does not change content identity');
          fs.appendFileSync(process.env.GITHUB_ENV, `T51_SOURCE=${sourceIdentity}\nT51_TARGET=${targetIdentity}\n`);

          const handoffPath = 'analysis/T5.1/canon-30-34-migration-handoff.json';
          const handoff = JSON.parse(fs.readFileSync(handoffPath, 'utf8'));
          handoff.sourceMainSha = MAIN_SHA;
          handoff.sourceContentIdentity = sourceIdentity;
          handoff.observedTargetContentIdentity = targetIdentity;
          handoff.sourceIdentityEvidence = {
            source: 'src/session/content-migration.ts#T51_T510_CONTENT_IDENTITY',
            fixture: `qa/fixtures/t5.1/post-t51-sources/${sourceIdentity}.json`,
            policy: 'The 30-34 batch extends the latest frozen upstream lineage node; it must not add shortcuts from older generations.'
          };
          handoff.targetIdentityEvidence.workflowRun = runId;
          handoff.targetIdentityEvidence.source = 'T5.1 30-34 T5.10-lineage focused validation / runtime contentIdentity(EVENTS)';
          handoff.targetIdentityEvidence.rule = 'Target is calculated from the active branch after syncing current main; historical copied target identities are invalid.';
          handoff.currentBatch.routeSemantics = 'Completed or pending events from the latest frozen upstream identity remain source provenance. Because no 30-34 identity is verified same-scene, upstream SEEN/cooldown must not suppress the repaired canonical definitions.';
          handoff.consumer.targetFreezeRequiredBeforeRouteRegistration = true;
          handoff.consumer.targetFreezeFixture = `qa/fixtures/t5.1/post-t51-sources/${targetIdentity}.json`;
          handoff.requiredCurrentRouteAssertions = handoff.requiredCurrentRouteAssertions
            .filter(value => !value.includes('PRE_T51 -> T51_B1A') && !value.includes('B1a-to-target'))
            .map(value => value === 'source identity is the frozen post-T5.1 B1a identity'
              ? 'source identity is the latest frozen upstream post-T5.1 identity'
              : value);
          for (const required of [
            'registered edge extends the existing upstream lineage without shortcut or ambiguity',
            'target identity is frozen as post-T5.1 source evidence before the upstream-to-target route is registered'
          ]) if (!handoff.requiredCurrentRouteAssertions.includes(required)) handoff.requiredCurrentRouteAssertions.push(required);
          fs.writeFileSync(handoffPath, JSON.stringify(handoff, null, 2) + '\n');

          const auditPath = 'analysis/T5.1/canon-30-34.json';
          const audit = JSON.parse(fs.readFileSync(auditPath, 'utf8'));
          audit.integrationStatus.syncedBaselineMain = MAIN_SHA;
          audit.integrationStatus.contentMigrationLineage = 'PRE_T51_to_B1A_to_T510_available_in_main';
          audit.integrationStatus.contentMigrationSourceIdentity = sourceIdentity;
          audit.integrationStatus.contentMigrationTargetFreeze = 'pending_post_t51_source_fixture';
          audit.integrationStatus.contentMigrationRoute = 'handoff_latest_upstream_to_target_freeze_and_registration_pending';
          audit.integrationStatus.targetContentIdentity = targetIdentity;
          audit.integrationStatus.targetedT51Run = runId;
          audit.integrationStatus.targetedT51Result = 'pending_current_run';
          audit.integrationStatus.sharedB1aTest = 'resolved_in_main_lineage_aware';
          audit.integrationStatus.sharedT510Test = 'known_downstream_lineage_stale_2_tests';
          audit.integrationStatus.temporaryValidationWorkflowRemoved = false;
          audit.globalDependencies = audit.globalDependencies.filter(dep => dep.id !== 'DEP_T51_B1A_TEST_LINEAGE_STALENESS');
          if (!audit.globalDependencies.some(dep => dep.id === 'DEP_T51_T510_TEST_LINEAGE_STALENESS')) {
            audit.globalDependencies.push({
              id: 'DEP_T51_T510_TEST_LINEAGE_STALENESS',
              kind: 'shared_test_contract',
              description: 'scripts/test-t51-t510-23-26.mjs validates T5.10 by assuming contentIdentity(EVENTS) remains T51_T510_CONTENT_IDENTITY and by resuming historical snapshots directly into that identity. A downstream canonical batch legitimately changes the active target, so shared integration must make the two lineage tests historical-node aware without weakening T5.10 content assertions.'
            });
          }
          const migrationDep = audit.globalDependencies.find(dep => dep.id === 'DEP_T51_EVENT_ID_MIGRATION');
          if (migrationDep) migrationDep.description = `Shared multigeneration migration lineage is available through T5.10 (${sourceIdentity.slice(0, 8)}…). Integration must freeze active 30-34 target ${targetIdentity.slice(0, 8)}… as post-T5.1 source evidence, then register/certify the unique latest-upstream -> target edge with the 27 exact-ID distinct_scene mappings. Shifted IDs remain deferred.`;
          fs.writeFileSync(auditPath, JSON.stringify(audit, null, 2) + '\n');

          const workstreamPath = 'project/workstreams/T51_CANON_30_34.md';
          let workstream = fs.readFileSync(workstreamPath, 'utf8');
          workstream = workstream.replace(/Baseline sincronizado: `main@[0-9a-f]+`\./, `Baseline sincronizado: \`main@${MAIN_SHA}\`.`);
          workstream = workstream.replace(/source content identity congelada post-B1a: `[0-9a-f]+`;/, `source content identity congelada upstream T5.10: \`${sourceIdentity}\`;`);
          workstream = workstream.replace(/target runtime real actual: `[0-9a-f]+`;/, `target runtime real actual: \`${targetIdentity}\`;`);
          workstream = workstream.replace(/- `DEP_T51_EVENT_ID_MIGRATION`:[^\n]*/, `- \`DEP_T51_EVENT_ID_MIGRATION\`: el lineage global llega a T5.10; integración debe congelar primero \`${targetIdentity.slice(0, 8)}…\` como evidencia post-T5.1 y registrar/certificar después el edge único latest-upstream → target con los 27 \`distinct_scene\`.`);
          workstream = workstream.replace(/\n- `DEP_T51_B1A_TEST_LINEAGE_STALENESS`:[^\n]*/g, '');
          if (!workstream.includes('DEP_T51_T510_TEST_LINEAGE_STALENESS')) {
            workstream = workstream.replace(
              '- `DEP_T51_SEED_TOPOLOGY`: no cerrar seeds sin evidencia downstream.',
              '- `DEP_T51_SEED_TOPOLOGY`: no cerrar seeds sin evidencia downstream.\n- `DEP_T51_T510_TEST_LINEAGE_STALENESS`: dos tests compartidos de T5.10 siguen tratando `fee2ff87…` como runtime final; deben validar T5.10 como nodo histórico del lineage cuando existe un batch posterior.'
            );
          }
          workstream = workstream.replace(/- `contentMigrationLineage: [^`]+`;/, '- `contentMigrationLineage: PRE_T51_to_B1A_to_T510_available_in_main`;');
          workstream = workstream.replace(/- `contentMigrationRoute: [^`]+`;/, '- `contentMigrationRoute: handoff_latest_upstream_to_target_freeze_and_registration_pending`;');
          workstream = workstream.replace(/target freeze `163b5823…`/g, `target freeze \`${targetIdentity.slice(0, 8)}…\``);
          const marker = 'Evidencia dirigida:\n';
          const line = `\n- run \`${runId}\`: validación T5.10-lineage focalizada en curso; source=\`${sourceIdentity.slice(0, 8)}…\`, target=\`${targetIdentity.slice(0, 8)}…\`; se separan los dos tests shared T5.10 que aún presuponen runtime final.\n`;
          if (!workstream.includes(`run \`${runId}\``)) workstream = workstream.replace(marker, marker + line);
          fs.writeFileSync(workstreamPath, workstream);
          NODE
      - name: Validate 30-34 plus historical B1a tests
        run: npm run audit:t51 && node --test scripts/test-t51.mjs scripts/test-t51-b1a-intel.mjs scripts/test-t51-30-34-trigger.mjs scripts/test-t51-30-34-readiness.mjs scripts/test-t51-30-34-migration-handoff.mjs
      - name: Characterize T5.10 downstream-lineage test debt
        run: |
          set +e
          node --test scripts/test-t51-t510-23-26.mjs > /tmp/t510-test.log 2>&1
          code=$?
          set -e
          cat /tmp/t510-test.log
          test "$code" -ne 0
          grep -q 'T5.10 extends the lineage PRE -> B1a -> T5.10 with no direct shortcut' /tmp/t510-test.log
          grep -q 'real B1a and pre-T5.1 Session v3 snapshots both migrate to T5.10 without RNG drift' /tmp/t510-test.log
          grep -q "$T51_SOURCE" /tmp/t510-test.log
          grep -q "$T51_TARGET" /tmp/t510-test.log
      - name: Validate inherited offer/session bridge
        run: npm run test:t51:offer-bridge
      - name: Characterize only remaining migration boundary
        run: |
          set +e
          node scripts/check-t51-content-migration-route.mjs > /tmp/migration-check.log 2>&1
          code=$?
          set -e
          cat /tmp/migration-check.log
          test "$code" -ne 0
          grep -q "$T51_TARGET" /tmp/migration-check.log
          grep -q 'has no frozen source evidence' /tmp/migration-check.log
      - name: Finalize evidence and remove temporary workflow
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const runId = Number(process.env.RUN_ID);
          const auditPath = 'analysis/T5.1/canon-30-34.json';
          const audit = JSON.parse(fs.readFileSync(auditPath, 'utf8'));
          audit.integrationStatus.targetedT51Run = runId;
          audit.integrationStatus.targetedT51Result = '30_34_plus_b1a_focused_pass';
          audit.integrationStatus.offerSessionBridgeValidation = 'pass';
          audit.integrationStatus.contentMigrationChecker = 'expected_missing_target_freeze_before_route_registration';
          audit.integrationStatus.temporaryValidationWorkflowRemoved = true;
          fs.writeFileSync(auditPath, JSON.stringify(audit, null, 2) + '\n');

          const workstreamPath = 'project/workstreams/T51_CANON_30_34.md';
          let workstream = fs.readFileSync(workstreamPath, 'utf8');
          workstream = workstream.replace(
            `- run \`${runId}\`: validación T5.10-lineage focalizada en curso; source=\`${process.env.T51_SOURCE?.slice(0, 8)}…\`, target=\`${process.env.T51_TARGET?.slice(0, 8)}…\`; se separan los dos tests shared T5.10 que aún presuponen runtime final.`,
            `- run \`${runId}\`: **PASS** de 30–34 + B1a histórico + offer/session bridge; los dos tests shared T5.10 reproducen de forma aislada su supuesto de runtime final; checker detenido únicamente por el freeze del target antes del nuevo edge.`
          );
          fs.writeFileSync(workstreamPath, workstream);
          NODE
          rm .github/workflows/t51-30-34-t510-lineage.yml
      - name: Commit validated lineage evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/T5.1/canon-30-34-migration-handoff.json analysis/T5.1/canon-30-34.json project/workstreams/T51_CANON_30_34.md .github/workflows/t51-30-34-t510-lineage.yml
          git commit -m 'audit(t51): bind 30-34 handoff to T5.10 upstream lineage'
          git push origin HEAD:t51/canon-30-34
