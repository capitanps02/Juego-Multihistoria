name: MUIR P11 Performance Compare

on:
  push:
    branches:
      - ui-a7/muir-p11-performance-platforms

concurrency:
  group: muir-p11-performance-${{ github.sha }}
  cancel-in-progress: true

jobs:
  performance:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install browser performance tooling
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Build current product
        run: npm run build
      - name: Capture current P11 performance
        run: |
          node scripts/capture-muir-browser.mjs
          mkdir -p analysis/muir/p11/evidence
          cp analysis/muir/evidence/browser-baseline.json analysis/muir/p11/evidence/current-browser-baseline.json
      - name: Reproduce P0 with exact same P11 harness
        run: |
          git worktree add --detach /tmp/muir-p0-performance 36d3d1b0750b0ded877e55953f223e2de1169a46
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/muir-p0-performance/node_modules
          cp analysis/muir/ui-fixtures/browser-runner.mjs /tmp/muir-p0-performance/analysis/muir/ui-fixtures/browser-runner.mjs
          cp scripts/capture-muir-browser.mjs /tmp/muir-p0-performance/scripts/capture-muir-browser.mjs
          (cd /tmp/muir-p0-performance && npm run build && node scripts/capture-muir-browser.mjs)
          cp /tmp/muir-p0-performance/analysis/muir/evidence/browser-baseline.json analysis/muir/p11/evidence/p0-same-harness-browser-baseline.json
      - name: Compare P0 and P11
        run: node scripts/compare-muir-p11-performance.mjs analysis/muir/p11/evidence/p0-same-harness-browser-baseline.json analysis/muir/p11/evidence/current-browser-baseline.json analysis/muir/p11/evidence/p11-performance-compare.json
      - name: Upload performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: muir-p11-performance-${{ github.sha }}
          if-no-files-found: error
          path: |
            analysis/muir/p11/evidence/*.json
