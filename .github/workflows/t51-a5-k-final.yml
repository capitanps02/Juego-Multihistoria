name: T51 A5 K final candidate

on:
  pull_request:
  push:
    branches:
      - 'a0/a5-k-final-after-a3'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Corrected K catalog/counts/identity
        run: node --test scripts/test-t51-a5-k-final.mjs
      - name: Refresh T5.2 lifecycle evidence
        run: node scripts/audit-t52.mjs
      - name: Causal seed fact provenance
        run: node --test scripts/test-t52-causal-seed-facts.mjs
      - name: Shared NPC and choice contracts
        run: node --test scripts/test-t51-shared-contracts.mjs scripts/test-t53-dynamic-targets.mjs
      - name: Freeze K and regenerate migration evidence
        run: |
          if [ -f "qa/fixtures/t5.1/post-t51-sources/a8fb037f6adb2ea52c862af86cae59c82b23853d7a9940166d732167b3e636a4.json" ]; then
            node scripts/freeze-t51-active-source.mjs --check
            node scripts/generate-t51-post-legacy-registry.mjs --check
            node scripts/generate-t51-offer-bridge-evidence.mjs --check
          else
            node scripts/freeze-t51-active-source.mjs
            node scripts/generate-t51-post-legacy-registry.mjs
            node scripts/generate-t51-offer-bridge-evidence.mjs
          fi
          npm run build
          node scripts/check-t51-content-migration-route.mjs
          node --test scripts/test-t51-content-migration.mjs scripts/test-t51-content-lineage.mjs scripts/test-t51-migration-source-policy.mjs
      - name: Persist generated K evidence on branch
        if: github.event_name == 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "qa/fixtures/t5.1/post-t51-sources/a8fb037f6adb2ea52c862af86cae59c82b23853d7a9940166d732167b3e636a4.json" src/session/post-t51-legacy-registry.ts src/session/frozen-offer-bridge-evidence.ts
          if git diff --cached --quiet; then
            echo "K evidence already frozen"
            exit 0
          fi
          git commit -m "test(A5 K): freeze corrected post-J source"
          git push origin HEAD:${{ github.head_ref }}
