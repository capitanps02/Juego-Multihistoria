name: QA A6 L v2
on:
  push:
    branches:
      - qa/cert-a6-l-133-v2
  pull_request:
    branches:
      - main
jobs:
  lock23:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test scripts/test-t5-lock23-captain-choice-guard.mjs
