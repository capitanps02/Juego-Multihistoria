name: T5.10 content identity probe

on:
  push:
    branches: ["t51/canon-23-30-t510-work"]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Make mixed migration fixture deterministic
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/test-t51-content-migration.mjs')
          text = path.read_text()
          needle = "  synthetic.weight = 1_000_000;\n"
          addition = "  synthetic.tags = ['hard_deadline'];\n"
          if addition not in text:
              if needle not in text:
                  raise SystemExit('synthetic migration fixture anchor not found')
              path.write_text(text.replace(needle, needle + addition, 1))
          PY
          if ! git diff --quiet -- scripts/test-t51-content-migration.mjs; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add scripts/test-t51-content-migration.mjs
            git commit -m "test(t5.1): make mixed migration fixture deterministic"
            git push origin HEAD:t51/canon-23-30-t510-work
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - name: Directed T5.10 tests
        run: node --test scripts/test-t51-t510-23-26.mjs
      - name: Migration route contract
        run: node scripts/check-t51-content-migration-route.mjs
      - name: T5 content references
        run: node scripts/qa-t5-content.mjs
      - name: Print target content identity
        run: node --input-type=module -e "import { EVENTS } from './dist/content/events/index.js'; import { contentIdentity } from './dist/session/content-identity.js'; console.log('T510_CONTENT_IDENTITY=' + await contentIdentity(EVENTS));"
      - name: Full repository regression
        run: npm test
