name: Repository integrity

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote_t51_124_evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout stacked product branch
        uses: actions/checkout@v4
        with:
          ref: t51/124-authoritative-18-20-wiring
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate exact post-T5.1 evidence
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          CURRENT_ID=$(node --input-type=module -e "import { EVENTS } from './dist/content/events/index.js'; import { contentIdentity } from './dist/session/content-identity.js'; console.log(await contentIdentity(EVENTS));")
          TARGET="qa/fixtures/t5.1/post-t51-sources/${CURRENT_ID}.json"
          if [ ! -f "$TARGET" ]; then
            node scripts/freeze-t51-active-source.mjs
          fi
          node scripts/generate-t51-post-legacy-registry.mjs
          node scripts/generate-t51-offer-bridge-evidence.mjs
          echo "Generated content identity: ${CURRENT_ID}"

      - name: Commit generated evidence to product branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa/fixtures/t5.1/post-t51-sources src/session/post-t51-legacy-registry.ts src/session/frozen-offer-bridge-evidence.ts
          if git diff --cached --quiet; then
            echo "Generated evidence already committed"
            exit 0
          fi
          git commit -m "T5.1 #124: freeze authoritative sport wiring generation"
          git push origin HEAD:t51/124-authoritative-18-20-wiring
