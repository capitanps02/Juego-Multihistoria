name: T5.11 next content identity temp

on:
  pull_request:
    branches: [main]

jobs:
  identity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Print next content identity
        run: node scripts/print-t51-next-content-identity.mjs
