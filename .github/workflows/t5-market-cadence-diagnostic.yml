name: T5 market cadence diagnostic

on:
  push:
    branches:
      - qa/t5-market-cadence-diagnostic-v2
    paths:
      - 'scripts/qa-t5-market-cadence.mjs'
      - '.github/workflows/t5-market-cadence-diagnostic.yml'
      - 'src/simulation/**'
      - 'src/narrative/**'
      - 'src/content/**'
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Reproduce loyal seed 512000
        env:
          T5_MARKET_CADENCE_SEED: '512000'
          T5_MARKET_CADENCE_OUTPUT: 'market-cadence-512000.json'
        run: node scripts/qa-t5-market-cadence.mjs
      - name: Upload full trace
        uses: actions/upload-artifact@v4
        with:
          name: market-cadence-512000
          path: market-cadence-512000.json
