name: QA A9 #61 certification

on:
  push:
    branches:
      - qa/cert-a9-61-current
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  retirement-authority:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: A10 #61 runtime + save regressions
        run: node --test scripts/test-t5-retirement-authority-known-bug.mjs scripts/test-t5-retirement-save-known-bug.mjs
