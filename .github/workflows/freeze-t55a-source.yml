name: Freeze T5.5-A source

on:
  push:
    branches: [t51/canon-20-23]
    paths:
      - '.github/workflows/freeze-t55a-source.yml'

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: t51/canon-20-23
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Freeze exact active catalog
        run: node scripts/freeze-t51-active-source.mjs
      - name: Commit generated fixture to feature branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa/fixtures/t5.1/post-t51-sources/*.json
          git commit -m "T5.5: freeze canonical 20-23 microbatch A source"
          git push origin HEAD:t51/canon-20-23
