name: T51 A5 K post-J generation

on:
  pull_request:
    paths:
      - 'src/content/events/**'
      - 'src/narrative/seed-memory.ts'
      - 'src/simulation/club-contract-intent.ts'
      - 'src/catalog/seeds.ts'
      - 'src/catalog/npc-knowledge-rules*.ts'
      - 'scripts/test-t51-a5-k.mjs'
      - 'scripts/print-a5-k-identity.mjs'
      - '.github/workflows/t51-a5-k.yml'

jobs:
  a5-k:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Focused A5 K regressions
        run: node --test scripts/test-t51-a5-k.mjs
      - name: Exact active content identity
        run: node scripts/print-a5-k-identity.mjs
