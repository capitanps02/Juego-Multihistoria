name: T51 A5 K generation

on:
  push:
    branches:
      - 'a0/a5-k-corrected-after-293'
    paths:
      - 'src/content/events/index.ts'
      - 'src/content/events/20_23/a5-ready-staged.ts'
      - 'src/catalog/npc-knowledge-rules-a5-k.ts'
      - 'src/catalog/npc-knowledge-rules.ts'
      - 'src/catalog/seeds.ts'
      - 'src/narrative/seed-memory.ts'
      - 'src/simulation/club-contract-intent.ts'
      - 'scripts/t52-causal-seed-facts.mjs'
      - 'scripts/test-t51-a5-k.mjs'
      - 'scripts/print-t51-a5-k-identity.mjs'
      - '.github/workflows/t51-a5-k.yml'
  workflow_dispatch:

jobs:
  k-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Five active post-J scenes and 388-event contract
        run: node --test scripts/test-t51-a5-k.mjs
      - name: Canonical build validation
        run: node scripts/final-gate-v08.mjs
      - name: Exact K identity
        run: node scripts/print-t51-a5-k-identity.mjs
      - name: Generate K freeze artifacts
        run: |
          node scripts/freeze-t51-active-source.mjs
          node scripts/generate-t51-post-legacy-registry.mjs
          node scripts/generate-t51-offer-bridge-evidence.mjs
      - name: Verify generated K freeze
        run: |
          node scripts/freeze-t51-active-source.mjs --check
          node scripts/generate-t51-post-legacy-registry.mjs --check
          node scripts/generate-t51-offer-bridge-evidence.mjs --check
      - name: Upload K freeze artifacts
        uses: actions/upload-artifact@v4
        with:
          name: a5-k-freeze
          path: |
            qa/fixtures/t5.1/post-t51-sources/9daf27e0566cf0a98f10d13f84160f9ab45d1c915407b5a7d5e06ddc3551c51d.json
            src/session/post-t51-legacy-registry.ts
            src/session/frozen-offer-bridge-evidence.ts
          if-no-files-found: error
