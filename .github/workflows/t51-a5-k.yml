name: T51 A5 K generation

on:
  push:
    branches:
      - 'a0/a5-k-after-281'
    paths:
      - 'src/content/events/index.ts'
      - 'src/content/events/20_23/a5-ready-staged.ts'
      - 'src/catalog/npc-knowledge-rules-a5-k.ts'
      - 'src/catalog/npc-knowledge-rules.ts'
      - 'src/catalog/seeds.ts'
      - 'src/narrative/seed-memory.ts'
      - 'src/simulation/club-contract-intent.ts'
      - 'scripts/t52-causal-seed-facts.mjs'
      - 'scripts/test-t51-a5-k.mjs'
      - 'scripts/print-t51-a5-k-identity.mjs'
      - '.github/workflows/t51-a5-k.yml'
  workflow_dispatch:

jobs:
  k-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Five active post-J scenes
        run: node --test scripts/test-t51-a5-k.mjs
      - name: Exact K identity
        run: node scripts/print-t51-a5-k-identity.mjs
