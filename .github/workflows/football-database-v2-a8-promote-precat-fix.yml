name: Football Database V2 · A8 promote pre-catalog validation deployables

on:
  push:
    branches: ["db-a8/football-database-v2-release"]
    paths:
      - '.github/workflows/football-database-v2-a8-promote-precat-fix.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: db-a8/football-database-v2-release
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Rebuild PlayCanvas
        run: npm run build:playcanvas
      - name: Rebuild Android offline
        run: npm run android:offline
      - name: Verify deployables
        run: node --test scripts/test-playcanvas.mjs scripts/test-android-offline.mjs
      - name: Promote only generated release paths
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin db-a8/football-database-v2-release
          REMOTE_SHA="$(git rev-parse origin/db-a8/football-database-v2-release)"
          if [ "$REMOTE_SHA" != "$GITHUB_SHA" ]; then
            echo "Branch moved: expected $GITHUB_SHA, found $REMOTE_SHA" >&2
            exit 42
          fi

          git add -A -- playcanvas/multihistoria.js playcanvas/manifest.json android/app/src/main/assets
          git rm .github/workflows/football-database-v2-a8-promote-precat-fix.yml

          git diff --cached --stat
          git diff --cached --name-status

          if git diff --cached --quiet; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "DB-A8: refresh pre-catalog validation deployables"

          git fetch origin db-a8/football-database-v2-release
          LATEST_REMOTE="$(git rev-parse origin/db-a8/football-database-v2-release)"
          if [ "$LATEST_REMOTE" != "$GITHUB_SHA" ]; then
            echo "Branch moved during build: expected $GITHUB_SHA, found $LATEST_REMOTE" >&2
            exit 43
          fi

          git push origin HEAD:db-a8/football-database-v2-release
