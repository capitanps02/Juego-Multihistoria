name: T51 A7 CURRENT PRE-FREEZE

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  a7-prefreeze:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Refresh CI-only A7 lineage evidence to current SAFE3 predecessor
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { EVENTS } from './dist/content/events/index.js';
          import { contentIdentity } from './dist/session/content-identity.js';
          const source='4973518cdceb84b86be62179ada2c0782da9f007c443d7ffd132ec88353229a3';
          const target=await contentIdentity(EVENTS);

          const handoffFile='analysis/T5.1/canon-30-34-migration-handoff.json';
          const readinessFile='analysis/T5.1/canon-30-34-implementation-readiness.json';
          const auditFile='analysis/T5.1/canon-30-34.json';
          const parityFile='analysis/T5.1/canon-30-34-parity-evidence.json';

          const handoff=JSON.parse(fs.readFileSync(handoffFile,'utf8'));
          handoff.sourceContentIdentity=source;
          handoff.observedTargetContentIdentity=target;
          handoff.consumer.targetFreezeFixture='qa/fixtures/t5.1/post-t51-sources/'+target+'.json';
          fs.writeFileSync(handoffFile,JSON.stringify(handoff,null,2)+'\n');

          const readiness=JSON.parse(fs.readFileSync(readinessFile,'utf8'));
          readiness.currentTarget.contentIdentity=target;
          readiness.currentTarget.fixture='qa/fixtures/t5.1/post-t51-sources/'+target+'.json';
          if(readiness.architectureEvidence?.contentMigration){
            readiness.architectureEvidence.contentMigration='Current integration predecessor is frozen SAFE3 '+source+'; active A7 target is '+target+'. Freeze/route remain coordination-owned.';
          }
          fs.writeFileSync(readinessFile,JSON.stringify(readiness,null,2)+'\n');

          const audit=JSON.parse(fs.readFileSync(auditFile,'utf8'));
          const dep=audit.globalDependencies.find(row=>row.id==='DEP_T51_EVENT_ID_MIGRATION');
          if(dep) dep.description='Latest frozen upstream lineage node is '+source+'. Integration must freeze the active 30-34 target '+target+' as post-T5.1 source evidence, then review/register the approved latest-upstream -> target edge.';
          audit.integrationStatus.contentMigrationSourceIdentity=source;
          audit.integrationStatus.targetContentIdentity=target;
          audit.integrationStatus.contentMigrationTargetFreeze='pending:'+target+'.json';
          audit.integrationStatus.contentMigrationLineage='frozen_upstream_'+source+'_available_in_current_lineage';
          fs.writeFileSync(auditFile,JSON.stringify(audit,null,2)+'\n');

          const parity=JSON.parse(fs.readFileSync(parityFile,'utf8'));
          const sc=parity.events?.EVT_30_CON_001?.dimensions?.saveContinuity;
          if(!sc) throw new Error('EVT_30_CON_001 parity saveContinuity missing');
          sc.sourceContentIdentity=source;
          sc.targetContentIdentity=target;
          fs.writeFileSync(parityFile,JSON.stringify(parity,null,2)+'\n');

          console.log(JSON.stringify({source,target}));
          NODE
      - name: A7 owner certification
        run: |
          node --test             scripts/test-t51-30-34-authority-gaps.mjs             scripts/test-t51-30-34-career-authority.mjs             scripts/test-t51-30-34-conditional-seed-reads.mjs             scripts/test-t51-30-34-conditionals.mjs             scripts/test-t51-30-34-contract-clause-handoff.mjs             scripts/test-t51-30-34-downstream-seed-handoff.mjs             scripts/test-t51-30-34-migration-handoff.mjs             scripts/test-t51-30-34-missing-principals.mjs             scripts/test-t51-30-34-multi-offer-handoff.mjs             scripts/test-t51-30-34-readiness.mjs             scripts/test-t51-30-34-seed-consumption.mjs             scripts/test-t51-30-34-seed-handoff.mjs             scripts/test-t51-30-34-sport-authority.mjs             scripts/test-t51-30-34-trigger.mjs
      - name: Emit exact A7 identity
        run: |
          node --input-type=module <<'NODE'
          import { EVENTS } from './dist/content/events/index.js';
          import { contentIdentity } from './dist/session/content-identity.js';
          const identity=await contentIdentity(EVENTS);
          const unique=new Set(EVENTS.map(e=>e.id)).size;
          console.log(JSON.stringify({identity,events:EVENTS.length,unique}));
          if(EVENTS.length!==365 || unique!==365) process.exit(1);
          NODE
