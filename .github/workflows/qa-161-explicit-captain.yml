name: QA #161 explicit captain producer
on:
  push:
    branches:
      - qa/cert-667-main-captain-producer
  pull_request:
    branches:
      - main
jobs:
  captain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test scripts/test-a13-t5-161-main-captain-candidate.mjs scripts/test-t5-captain-gap-known-bug.mjs
