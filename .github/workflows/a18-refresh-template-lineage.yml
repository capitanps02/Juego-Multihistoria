name: A18 Refresh Template Lineage

on:
  push:
    branches:
      - content/a18-3-templates-options

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout final A18 template branch
        uses: actions/checkout@v4
        with:
          ref: content/a18-3-templates-options
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Freeze exact catalog and regenerate lineage
        shell: bash
        run: |
          set -euo pipefail
          if ! node scripts/freeze-t51-active-source.mjs --check; then
            node scripts/freeze-t51-active-source.mjs
          fi
          node scripts/generate-t51-post-legacy-registry.mjs
          node scripts/generate-t51-offer-bridge-evidence.mjs
      - name: Commit canonical artifacts and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git add qa/fixtures/t5.1/post-t51-sources src/session/post-t51-legacy-registry.ts src/session/frozen-offer-bridge-evidence.ts
          git rm .github/workflows/a18-refresh-template-lineage.yml
          git config user.name "a18-content-bot"
          git config user.email "a18-content-bot@users.noreply.github.com"
          git commit -m "A18: freeze template cleanup lineage"
          git push origin HEAD:content/a18-3-templates-options
