name: T51 A5 Next Pre-freeze

on:
  pull_request:
    branches: ['a0/shared-closure-bundle-main']
  push:
    branches: ['a0/a5-next-two-after-shared-bundle']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  a5-next-prefreeze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: A5 next exact activation and target identity
        run: node --test scripts/test-t51-a5-representation-ready.mjs scripts/test-t51-a5-market-ready.mjs scripts/test-t51-a5-next-prefreeze.mjs
