name: T51 veteran renewal sync

on:
  push:
    branches:
      - t51/canon-30-34

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: t51/canon-30-34
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Patch resolved renewal dependency
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('analysis/T5.1/canon-30-34.json')
          data = json.loads(path.read_text())
          row = next(r for r in data['principals'] if r['canonicalId'] == 'EVT_30_CON_001')
          row['implementation'] = (
              'canonical decision semantics implemented; canonical trigger contract <=18 months OR club wants renewal '
              'is now represented exactly through gateAlternatives and facts.clubWantsRenewal. The scene remains '
              'needs_reimplementation because knowledge/consequence/seed/NPC/save-continuity identity parity is not fully proven'
          )
          data['globalDependencies'] = [
              dep for dep in data['globalDependencies']
              if dep['id'] != 'DEP_T51_RENEWAL_INTENT_FACT'
          ]
          for dep in data['globalDependencies']:
              if dep['id'] == 'DEP_T51_BRIDGE_PRIORITY':
                  dep['description'] = (
                      'The shared transition-priority contract is available, but canonical EVT_30_BRIDGE_001 is still a shifted '
                      'identity versus legacy EVT_30_IDN_001. Do not opt the legacy scene into mandatory priority until identity '
                      'and migration are approved.'
                  )
          data['verifiedBehavior'] = [
              item for item in data['verifiedBehavior']
              if 'unmodelled club-renewal branch' not in item['claim'].lower()
          ]
          data['verifiedBehavior'].append({
              'claim': 'EVT_30_CON_001 now uses the canonical renewal OR trigger without the former reachability proxy.',
              'evidence': (
                  'The active catalog uses gateAlternatives for contract.monthsRemaining <= 18 OR '
                  'facts.clubWantsRenewal == true; dedicated tests cover both positive routes and the closed negative case.'
              )
          })
          data['integrationStatus']['syncedBaselineMain'] = 'e48a6c85d0a9e61d88eca121f683dcd308c188c1'
          data['integrationStatus']['renewalIntentFact'] = 'available_in_main_and_consumed'
          data['implementationDisposition']['safeNow'] = [
              ('Use EVT_30_CON_001 with the exact shared OR trigger contract; keep technical_adaptation until the remaining '
               'identity dimensions are proven.')
              if line.startswith('Keep EVT_30_CON_001 reachable through the documented proxy') else line
              for line in data['implementationDisposition']['safeNow']
          ]
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
          PY
      - name: Build and calculate current content identity
        run: |
          npm run build
          node --input-type=module - <<'NODE' > /tmp/t51-target-id
          import { EVENTS } from './dist/content/events/index.js';
          import { contentIdentity } from './dist/session/content-identity.js';
          console.log(await contentIdentity(EVENTS));
          NODE
          node --input-type=module - <<'NODE' > /tmp/t51-source-id
          import { CONTENT_MIGRATION_ROUTES, LEGACY_CONTENT_SOURCES, findMigrationPath } from './dist/session/content-migration.js';
          import { PRE_T51_CONTENT_IDENTITY } from './dist/session/pre-t51-legacy-registry.js';
          const sourceIds = Object.keys(LEGACY_CONTENT_SOURCES);
          const outgoing = new Set(CONTENT_MIGRATION_ROUTES.map(route => route.sourceContentIdentity));
          const leaves = sourceIds.filter(id => id !== PRE_T51_CONTENT_IDENTITY)
            .filter(id => findMigrationPath(PRE_T51_CONTENT_IDENTITY, id, CONTENT_MIGRATION_ROUTES))
            .filter(id => !outgoing.has(id));
          if (leaves.length !== 1) throw new Error(`Expected one latest frozen upstream leaf, got ${JSON.stringify(leaves)}`);
          console.log(leaves[0]);
          NODE
          echo "target=$(cat /tmp/t51-target-id)"
          echo "source=$(cat /tmp/t51-source-id)"
      - name: Refresh migration handoff identities
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          target = Path('/tmp/t51-target-id').read_text().strip()
          source = Path('/tmp/t51-source-id').read_text().strip()
          handoff_path = Path('analysis/T5.1/canon-30-34-migration-handoff.json')
          handoff = json.loads(handoff_path.read_text())
          handoff['sourceContentIdentity'] = source
          handoff['observedTargetContentIdentity'] = target
          handoff_path.write_text(json.dumps(handoff, ensure_ascii=False, indent=2) + '\n')
          audit_path = Path('analysis/T5.1/canon-30-34.json')
          audit = json.loads(audit_path.read_text())
          audit['integrationStatus']['targetContentIdentity'] = target
          audit['integrationStatus']['contentMigrationSourceIdentity'] = source
          audit_path.write_text(json.dumps(audit, ensure_ascii=False, indent=2) + '\n')
          PY
      - name: Validate veteran block
        run: npm run test:t51:30-34
      - name: Commit synchronized evidence
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add analysis/T5.1/canon-30-34.json analysis/T5.1/canon-30-34-migration-handoff.json
          if git diff --cached --quiet; then
            echo 'No evidence changes to commit.'
          else
            git commit -m 'audit(t51): consume renewal intent and refresh migration identity'
            git push origin HEAD:t51/canon-30-34
          fi
