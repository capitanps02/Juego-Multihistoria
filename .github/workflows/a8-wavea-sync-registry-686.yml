name: Sync A8 Wave A generated registries #686
on:
  push:
    branches:
      - a12/a8-wavea-clean-current-647
permissions:
  contents: write
jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a12/a8-wavea-clean-current-647
          fetch-depth: 0
      - name: Sync current main into #686 branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge origin/main --no-edit
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Freeze exact current-main Wave A and regenerate registries
        run: |
          if [ ! -f "qa/fixtures/t5.1/post-t51-sources/6a511209e08514759d082e90182fa8fe4ef6a1e75cb8aa379f1bf0d87d044018.json" ]; then
            node scripts/freeze-t51-active-source.mjs
          fi
          node scripts/generate-t51-post-legacy-registry.mjs
          node scripts/generate-t51-offer-bridge-evidence.mjs
          node scripts/freeze-t51-active-source.mjs --check
          git rm -f .github/workflows/a8-wavea-sync-registry-686.yml
          git add qa/fixtures/t5.1/post-t51-sources/6a511209e08514759d082e90182fa8fe4ef6a1e75cb8aa379f1bf0d87d044018.json src/session/post-t51-legacy-registry.ts src/session/frozen-offer-bridge-evidence.ts src/session/content-migration.ts
          git commit -m "A8 Wave A: freeze exact current-main identity 6a511209e085"
          git push origin HEAD:a12/a8-wavea-clean-current-647
