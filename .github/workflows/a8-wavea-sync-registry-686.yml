name: Sync A8 Wave A generated registries #686
on:
  push:
    branches:
      - a12/a8-wavea-clean-current-647
permissions:
  contents: write
jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a12/a8-wavea-clean-current-647
          fetch-depth: 0
      - name: Sync current main into #686 branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge origin/main --no-edit
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Validate exact Wave A freeze and regenerate registries
        run: |
          node scripts/freeze-t51-active-source.mjs --check
          node scripts/generate-t51-post-legacy-registry.mjs
          node scripts/generate-t51-offer-bridge-evidence.mjs
          git add src/session/post-t51-legacy-registry.ts src/session/frozen-offer-bridge-evidence.ts
          if ! git diff --cached --quiet; then
            git commit -m "A8 Wave A: sync generated registries on current main"
          fi
          git push origin HEAD:a12/a8-wavea-clean-current-647
