name: T5 Determinism Isolation Probe

on:
  push:
    branches: ['a11/ci-403-determinism']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  determinism:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Exact repository-integrity determinism command
        run: node --test --test-name-pattern="T5 determinism" scripts/test-t5-regression.mjs
