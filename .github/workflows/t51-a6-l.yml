name: T51 A6 L certification
on:
  push:
    branches: ['a0/a6-l-candidate']
  pull_request:
    branches: [main]
    paths:
      - 'src/content/events/23_26/**'
      - 'scripts/test-t51-agent6-*.mjs'
      - 'scripts/test-t51-a6-l.mjs'
      - 'src/session/content-migration.ts'
      - 'qa/fixtures/t5.1/post-t51-sources/**'
      - '.github/workflows/t51-a6-l.yml'
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test scripts/test-t51-agent6-lock23.mjs scripts/test-t51-agent6-mkt25.mjs scripts/test-t51-agent6-offers23-25.mjs scripts/test-t51-a6-l.mjs
