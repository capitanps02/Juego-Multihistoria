name: A11 exact A9 staging current
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Factual last appearance
        run: node --test scripts/test-t5-last-player-appearance.mjs
      - name: Career summary save/fact integrity
        run: node --test scripts/test-t536-career-summary.mjs
