name: QA #61 runtime on current main
on:
  push:
    branches:
      - qa/cert-main-61-runtime
  pull_request:
    branches:
      - main
jobs:
  retirement-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test scripts/test-t5-retirement-authority-known-bug.mjs scripts/test-t5-retirement-save-known-bug.mjs
