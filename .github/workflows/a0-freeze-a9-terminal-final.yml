name: A0 freeze A9 terminal final
on:
  push:
    branches:
      - a0/a9-terminal-final
permissions:
  contents: write
jobs:
  freeze:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a0/a9-terminal-final
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Generate exact terminal source and registries
        run: |
          if [ -f "qa/fixtures/t5.1/post-t51-sources/d0fee1ceef2c3bdb7d8cd933ce773341a3c375b39deedcc21cd801a8c3f67770.json" ]; then
            echo "already frozen"
            exit 0
          fi
          node scripts/freeze-t51-active-source.mjs
          node scripts/generate-t51-post-legacy-registry.mjs
          node scripts/generate-t51-offer-bridge-evidence.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa/fixtures/t5.1/post-t51-sources/d0fee1ceef2c3bdb7d8cd933ce773341a3c375b39deedcc21cd801a8c3f67770.json src/session/post-t51-legacy-registry.ts src/session/frozen-offer-bridge-evidence.ts
          git commit -m "A0 freeze: serialize final A9 terminal identity d0fee1ceef2c"
          git push origin HEAD:a0/a9-terminal-final
