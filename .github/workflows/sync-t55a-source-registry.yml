name: Sync T5.5-A source registry

on:
  push:
    branches: [t51/canon-20-23]
    paths:
      - '.github/workflows/sync-t55a-source-registry.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: t51/canon-20-23
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Regenerate frozen-source registry
        run: node scripts/generate-t51-post-legacy-registry.mjs
      - name: Verify generated registry
        run: node scripts/generate-t51-post-legacy-registry.mjs --check
      - name: Commit generated registry to feature branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/session/post-t51-legacy-registry.ts
          if git diff --cached --quiet; then
            echo "Registry already current"
            exit 0
          fi
          git commit -m "T5.5: register frozen microbatch A source evidence"
          git push origin HEAD:t51/canon-20-23
