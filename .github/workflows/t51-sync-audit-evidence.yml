name: T5.1 sync veteran audit evidence

on:
  push:
    branches:
      - t51/canon-30-34

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Sync audit evidence
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p = Path('analysis/T5.1/canon-30-34.json')
          s = p.read_text()
          replacements = {
            '"syncedBaselineMain": "4b86e83c670f9659d57e0dcfa370897f38f5b579"': '"syncedBaselineMain": "fb545cd18c6828b1f8d636435d91e296e92eaab6"',
            '"targetedT51Run": 35115188014': '"targetedT51Run": 35123290229',
            '"targetedT51Result": "13/13_pass"': '"targetedT51Result": "29/29_pass"',
            '"contentMigrationRoute": "required_not_registered"': '"contentMigrationRoute": "handoff_ready_registration_pending"',
            'targeted run 35115188014 passed all 13 T5.1 30–34 tests.': 'targeted run 35123290229 passed all 29 T5.1 30–34 tests, including the permanent guard that rejects stale OR-gate dependency wording.'
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'missing expected evidence text: {old}')
              s = s.replace(old, new, 1)
          data = json.loads(s)
          assert data['integrationStatus']['syncedBaselineMain'] == 'fb545cd18c6828b1f8d636435d91e296e92eaab6'
          assert data['integrationStatus']['sharedOrGateContract'] == 'available_in_main'
          assert data['integrationStatus']['targetedT51Run'] == 35123290229
          assert data['integrationStatus']['targetedT51Result'] == '29/29_pass'
          assert data['integrationStatus']['contentMigrationRoute'] == 'handoff_ready_registration_pending'
          p.write_text(s)
          PY
      - run: npm run test:t51
      - name: Commit synchronized evidence and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/t51-sync-audit-evidence.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/T5.1/canon-30-34.json .github/workflows/t51-sync-audit-evidence.yml
          git commit -m 'docs(t51): sync veteran audit evidence'
          git push origin HEAD:t51/canon-30-34
