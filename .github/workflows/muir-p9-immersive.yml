name: MUIR P9 Immersive

on:
  push:
    branches:
      - ui-a6/muir-p9-immersive
  pull_request:
    branches:
      - ui-a5/muir-p8-world-career

concurrency:
  group: muir-p9-immersive-cert-${{ github.sha }}
  cancel-in-progress: true

jobs:
  p9-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build engine
        run: npm run build
      - name: P9 exact predecessor and frozen baseline contract
        run: node --test scripts/test-muir-p9-baseline.mjs
      - name: P9 Decision presentation contract
        run: node --test scripts/test-muir-p9-decisions.mjs
      - name: P9 Result presentation contract
        run: node --test scripts/test-muir-p9-results.mjs
      - name: P9 Offer presentation contract
        run: node --test scripts/test-muir-p9-offers.mjs
      - name: P9 Cinematic presentation contract
        run: node --test scripts/test-muir-p9-cinematics.mjs
      - name: P9 final authority equivalence contract
        run: node --test scripts/test-muir-p9-final.mjs
      - name: P8 certified exact-head regression contract
        run: |
          git worktree add /tmp/muir-p8-certified ecc72b9abebbc64533c86b1f3cf7009a127c0c02
          (cd /tmp/muir-p8-certified && node --test scripts/test-muir-p8-final.mjs)
          git worktree remove /tmp/muir-p8-certified
      - name: P7 semantic regression
        run: node scripts/test-muir-p7-semantic-components.mjs
      - name: Decision/result focused session smoke
        run: node --test scripts/test-muir-p9-session-smoke.mjs
      - name: Decision consequence and UI regressions
        run: node --test scripts/test-t55-consequences.mjs scripts/test-t55-a19-ui.mjs
      - name: Offer/PublicOffer/delegation regressions
        run: node --test scripts/test-offers.mjs scripts/test-t51-offer-bridge.mjs scripts/test-t51-offer-bridge-provenance.mjs
      - name: Cinematic and fallback regressions
        run: node --test scripts/test-event-cutscenes.mjs
      - name: P9 runtime and persistence authority scope guard
        run: git diff --exit-code ecc72b9abebbc64533c86b1f3cf7009a127c0c02..HEAD -- src web/indexed-save-store.js
      - name: Shared UI package graph
        run: node --test scripts/test-muir-package-graph.mjs
      - name: P9 final persistence and save regressions
        run: node --test scripts/test-persistence.mjs scripts/test-saves.mjs scripts/test-t5-save-compat.mjs scripts/test-t5-retirement-save-known-bug.mjs
      - name: P9 full session regression
        run: node --test scripts/test-session.mjs
      - name: PlayCanvas full final package regression
        run: npm run test:playcanvas
      - name: Android offline package and authority regression
        run: npm run test:android:offline
      - name: Install browser tooling
        run: |
          npm install --no-save playwright@1.55.0 axe-core@4
          npx playwright install --with-deps chromium
      - name: Reproduce frozen P9.1 browser baseline
        run: |
          git worktree add /tmp/muir-p9-pass1 7db5d9ded08e0b020fc4a2f916fd974fa4091cbf
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/muir-p9-pass1/node_modules
          (cd /tmp/muir-p9-pass1 && npm run build)
          MUIR_ROOT=/tmp/muir-p9-pass1 node analysis/muir/p9/browser-baseline-probe.mjs
          mkdir -p analysis/muir/p9/evidence analysis/muir/p9/screenshots
          cp /tmp/muir-p9-pass1/analysis/muir/p9/evidence/p9-baseline.json analysis/muir/p9/evidence/
          cp /tmp/muir-p9-pass1/analysis/muir/p9/screenshots/*.png analysis/muir/p9/screenshots/
          git worktree remove --force /tmp/muir-p9-pass1
      - name: P9 Decision responsive and accessibility matrix
        run: node analysis/muir/p9/browser-decisions-probe.mjs
      - name: P9 Result responsive and accessibility matrix
        run: node analysis/muir/p9/browser-results-probe.mjs
      - name: P9 Offer responsive and accessibility matrix
        run: node analysis/muir/p9/browser-offers-probe.mjs
      - name: P9 Cinematic real-video and fallback matrix
        run: node analysis/muir/p9/browser-cinematics-probe.mjs
      - name: Upload P9 baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: muir-p9-${{ github.sha }}
          if-no-files-found: warn
          path: |
            analysis/muir/p9/evidence/*.json
            analysis/muir/p9/screenshots/*.png

  p9-android-back:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: npm ci
      - name: Build Android offline assets
        run: npm run android:offline
      - name: Install Android API 35 emulator image
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "emulator" "platforms;android-35" "system-images;android-35;google_apis;x86_64"
          echo no | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/avdmanager" create avd --force --name muir-p9-api35 --package "system-images;android-35;google_apis;x86_64"
      - name: Build app and instrumentation APKs
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Boot dedicated Android emulator
        run: |
          sudo chmod 666 /dev/kvm || true
          nohup "$ANDROID_SDK_ROOT/emulator/emulator" -avd muir-p9-api35 -no-window -noaudio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -wipe-data > /tmp/muir-p9-emulator.log 2>&1 &
          "$ANDROID_SDK_ROOT/platform-tools/adb" wait-for-device
          timeout 240 bash -c 'until [ "$("$ANDROID_SDK_ROOT/platform-tools/adb" shell getprop sys.boot_completed | tr -d "\r")" = "1" ]; do sleep 2; done'
          "$ANDROID_SDK_ROOT/platform-tools/adb" shell input keyevent 82
      - name: P9 native Android Back semantics
        run: |
          SERIAL=$("$ANDROID_SDK_ROOT/platform-tools/adb" devices | awk '/^emulator-/{print $1; exit}')
          test -n "$SERIAL"
          node scripts/test-muir-p9-android-back.mjs "$SERIAL"
      - name: Upload Android Back evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: muir-p9-android-back-${{ github.sha }}
          if-no-files-found: warn
          path: |
            analysis/muir/p9/evidence/p9-android-back.json
            /tmp/muir-p9-emulator.log
