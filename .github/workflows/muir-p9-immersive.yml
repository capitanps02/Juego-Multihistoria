name: MUIR P9 Immersive

on:
  push:
    branches:
      - ui-a6/muir-p9-immersive
  pull_request:
    branches:
      - ui-a5/muir-p8-world-career

concurrency:
  group: muir-p9-immersive-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  p9-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build engine
        run: npm run build
      - name: P9 exact predecessor and baseline contract
        run: node --test scripts/test-muir-p9-baseline.mjs
      - name: P8 certified exact-head regression contract
        run: |
          git worktree add /tmp/muir-p8-certified ecc72b9abebbc64533c86b1f3cf7009a127c0c02
          (cd /tmp/muir-p8-certified && node --test scripts/test-muir-p8-final.mjs)
          git worktree remove /tmp/muir-p8-certified
      - name: P7 semantic regression
        run: node scripts/test-muir-p7-semantic-components.mjs
      - name: Decision/result focused session smoke
        run: node --test scripts/test-muir-p9-session-smoke.mjs
      - name: Decision consequence and UI regressions
        run: node --test scripts/test-t55-consequences.mjs scripts/test-t55-a19-ui.mjs
      - name: Offer/PublicOffer/delegation regressions
        run: node --test scripts/test-offers.mjs scripts/test-t51-offer-bridge.mjs scripts/test-t51-offer-bridge-provenance.mjs
      - name: Cinematic and fallback regressions
        run: node --test scripts/test-event-cutscenes.mjs
      - name: Persistence regression
        run: node --test scripts/test-persistence.mjs
      - name: Shared UI package graph
        run: node --test scripts/test-muir-package-graph.mjs
      - name: PlayCanvas package smoke
        run: npm run test:playcanvas
      - name: Install browser tooling
        run: |
          npm install --no-save playwright@1.55.0 axe-core@4
          npx playwright install --with-deps chromium
      - name: P9 immersive browser baseline
        run: node analysis/muir/p9/browser-baseline-probe.mjs
      - name: Upload P9 baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: muir-p9-${{ github.sha }}
          if-no-files-found: warn
          path: |
            analysis/muir/p9/evidence/*.json
            analysis/muir/p9/screenshots/*.png
