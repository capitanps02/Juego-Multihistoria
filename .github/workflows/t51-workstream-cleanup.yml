name: T51 workstream cleanup
on:
  push:
    branches: [t51/canon-30-34]
permissions:
  contents: write
jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: t51/canon-30-34
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Remove stale veteran status text
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('project/workstreams/T51_CANON_30_34.md')
          s = p.read_text()
          s = s.replace(
            'Además protege el estado de OR gates: el contrato `gateAlternatives` ya existe en `main`, por lo que `DEP_T51_OR_GATES` está cerrado. La deuda real de `EVT_30_CON_001` es `DEP_T51_RENEWAL_INTENT_FACT`: falta una señal causal autoritativa de “el club quiere renovar”.',
            'Además protege el estado de OR gates y renovación: `gateAlternatives` y `facts.clubWantsRenewal` ya existen en `main` y `EVT_30_CON_001` consume ambas ramas del trigger canónico. `DEP_T51_OR_GATES` y `DEP_T51_RENEWAL_INTENT_FACT` están cerrados; la escena conserva únicamente deuda de paridad integral.'
          )
          s = s.replace(
            '`main` ya soporta OR gates mediante `gateAlternatives`; por tanto OR ya no es bloqueo arquitectónico. GameState aún no produce un hecho autoritativo de intención de renovación. La escena conserva `t51_unmodelled_club_renewal_proxy` y `t51_trigger_approximation`, pero no se declara verificada.',
            '`main` soporta OR gates mediante `gateAlternatives` y expone `facts.clubWantsRenewal`. La escena usa ya el trigger exacto `contract.monthsRemaining <= 18 OR facts.clubWantsRenewal == true`; se eliminaron los tags del antiguo proxy, pero no se declara verificada hasta demostrar todas las dimensiones de identidad.'
          )
          s = s.replace(
            '- `DEP_T51_EVENT_ID_MIGRATION`: el lineage global llega a T5.10; integración debe congelar primero `b7483243…` como evidencia post-T5.1 y registrar/certificar después el edge único latest-upstream → target con los 27 `distinct_scene`.',
            '- `DEP_T51_EVENT_ID_MIGRATION`: la última fuente congelada upstream es `5d3fd71a…56d2`; integración debe congelar primero el target `380d28e0…3989` y registrar/certificar después el edge único latest-upstream → target con los 27 `distinct_scene`.'
          )
          s = s.replace(
            '- `DEP_T51_BRIDGE_PRIORITY`: `EVT_30_BRIDGE_001` debe ser puente obligatorio de inicio de Pasada 6; el scheduler ordinario no lo garantiza.\n- `DEP_T51_RENEWAL_INTENT_FACT`: falta hecho causal producido para intención de renovación.',
            '- `DEP_T51_BRIDGE_PRIORITY`: la infraestructura compartida de prioridad ya existe, pero `EVT_30_BRIDGE_001` sigue siendo una identidad desplazada frente a `EVT_30_IDN_001`; no se debe marcar el legacy como obligatorio antes de aprobar identidad/migración.'
          )
          s = s.replace(
            'Baseline sincronizado: `main@30ae3f27ddcb846f59f049e3a4536276f3e9a97e`.',
            'Baseline sincronizado: `main@e48a6c85d0a9e61d88eca121f683dcd308c188c1`.'
          )
          s = s.replace(
            '- `contentMigrationLineage: PRE_T51_to_B1A_to_T510_available_in_main`;\n- `contentMigrationRoute: handoff_latest_upstream_to_target_freeze_and_registration_pending`;\n- `targetedT51Result: 30_34_plus_b1a_focused_pass`;',
            '- `contentMigrationLineage`: latest frozen upstream `5d3fd71a…56d2` disponible en `main`;\n- `contentMigrationRoute`: target freeze `380d28e0…3989` y registro del edge siguen pendientes de integración;\n- `targetedT51Result: 32_of_32_veteran_focused_pass`;'
          )
          s = s.replace('\n- hecho causal de intención de renovación;', '')
          p.write_text(s)
          PY
      - run: npm run test:t51:30-34
      - name: Commit cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add project/workstreams/T51_CANON_30_34.md
          git commit -m 'docs(t51): remove stale veteran dependency text'
          git push origin HEAD:t51/canon-30-34
