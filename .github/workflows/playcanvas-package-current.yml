name: PlayCanvas package current

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  committed-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/check-playcanvas-package-current.mjs
      - run: npm run build
      - run: node --test scripts/test-playcanvas.mjs
