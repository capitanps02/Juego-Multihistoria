name: T51 A6 remaining owner staging

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  a6-rest-owner:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: A6 remaining owner regressions
        run: >
          node --test
          scripts/test-t51-agent6-age26-bridge.mjs
          scripts/test-t51-agent6-doc26.mjs
          scripts/test-t51-agent6-body27.mjs
          scripts/test-t51-agent6-con27.mjs
          scripts/test-t51-agent6-fin29.mjs
