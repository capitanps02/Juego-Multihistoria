name: A0 freeze #161 current
on:
  push:
    branches: [a0/t5-161-captain-appointment-final]
permissions:
  contents: write
jobs:
  freeze:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a0/t5-161-captain-appointment-final
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify #161 product
        run: node --test scripts/test-t5-161-main-captain-final.mjs
      - name: Freeze exact successor
        run: |
          if [ -f "qa/fixtures/t5.1/post-t51-sources/56b9ca09b872ac6dc8fc78ec9459bf15fb7ab21c20707f354af06c99ee00d0f4.json" ]; then
            node scripts/freeze-t51-active-source.mjs --check
          else
            node scripts/freeze-t51-active-source.mjs
          fi
          node scripts/generate-t51-post-legacy-registry.mjs
          node scripts/generate-t51-offer-bridge-evidence.mjs
          npm run build
          node scripts/check-t51-content-migration-route.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "qa/fixtures/t5.1/post-t51-sources/56b9ca09b872ac6dc8fc78ec9459bf15fb7ab21c20707f354af06c99ee00d0f4.json" src/session/post-t51-legacy-registry.ts src/session/frozen-offer-bridge-evidence.ts
          if ! git diff --cached --quiet; then
            git commit -m "A0 freeze: serialize #161 current successor 56b9ca09b872"
            git push origin HEAD:a0/t5-161-captain-appointment-final
          fi
