name: QA A6 retirement dead-end
on:
  push:
    branches:
      - qa/cert-549-retirement-deadend
  pull_request:
    branches:
      - main
jobs:
  deadend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test scripts/test-t5-a6-retirement-deadend.mjs
