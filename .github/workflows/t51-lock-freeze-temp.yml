name: T51 LOCK23 temporary freeze

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  freeze:
    if: github.head_ref == 'integration/t511-lock-23-26'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Freeze active LOCK23 catalog
        run: node scripts/freeze-t51-active-source.mjs

      - name: Regenerate post-T5.1 legacy registry
        run: node scripts/generate-t51-post-legacy-registry.mjs

      - name: Regenerate frozen offer bridge evidence
        run: node scripts/generate-t51-offer-bridge-evidence.mjs

      - name: Commit generated evidence to this feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa/fixtures/t5.1/post-t51-sources src/session/post-t51-legacy-registry.ts src/session/frozen-offer-bridge-evidence.ts
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "chore(t51): freeze LOCK23 content generation"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
