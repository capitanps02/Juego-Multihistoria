name: Android presentation candidate

on:
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - 'web/**'
      - 'src/**'
      - 'scripts/build-android-*.mjs'
      - 'scripts/test-android-offline.mjs'
      - 'scripts/test-presentation-platform.mjs'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Node dependencies
        run: npm ci

      - name: Ensure Android API 35 is installed
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'

      - name: Run presentation regression
        run: npm run test:presentation

      - name: Verify offline Android package
        run: npm run test:android:offline

      - name: Build debug APK candidate
        run: npm run android:apk

      - name: Verify APK build report
        run: node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync('analysis/2026-09-15/T3.3-apk-build.json','utf8'));if(r.status!=='pass'||!r.apk?.sha256)process.exit(1);console.log(JSON.stringify(r.apk));"

      - name: Upload Android candidate
        uses: actions/upload-artifact@v4
        with:
          name: multihistoria-android-presentation-candidate
          if-no-files-found: error
          retention-days: 14
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/src/main/assets/offline-manifest.json
            analysis/2026-09-15/T3.3-apk-build.json
