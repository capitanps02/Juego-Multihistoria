name: A6 regenerate integrated PlayCanvas package

on:
  push:
    branches:
      - a6/player-actions-integrated-qa
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: a6-integrated-playcanvas-package
  cancel-in-progress: true

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout integrated candidate
        uses: actions/checkout@v4
        with:
          ref: a6/player-actions-integrated-qa
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install and rebuild PlayCanvas package
        run: |
          npm ci
          npm run build:playcanvas

      - name: Commit generated package when changed
        run: |
          if git diff --quiet -- playcanvas/multihistoria.js playcanvas/manifest.json web/assets.json; then
            echo "PlayCanvas package already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playcanvas/multihistoria.js playcanvas/manifest.json web/assets.json
          git commit -m "build(A6): regenerate integrated PlayCanvas package"
          git push origin HEAD:a6/player-actions-integrated-qa
