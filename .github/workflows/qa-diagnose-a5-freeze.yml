name: QA diagnose A5 freeze
on:
  push:
    branches:
      - qa/diagnose-444-freeze
  pull_request:
    branches:
      - main
jobs:
  freeze-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check exact active source fixture
        run: node scripts/freeze-t51-active-source.mjs --check
      - name: Emit active A5 identity
        run: node --test scripts/test-t51-a5-next-prefreeze.mjs
