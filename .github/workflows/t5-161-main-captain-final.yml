name: T5 #161 explicit main captain closure
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  captain-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test scripts/test-t5-161-main-captain-final.mjs
