name: T511b EUR eligibility freeze

on:
  push:
    branches:
      - integration/t511b-eur-eligibility

permissions:
  contents: write

jobs:
  repair-freeze:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Patch EUR causal gate and historical directed test
        run: |
          python - <<'PY'
          from pathlib import Path

          event_path = Path('src/content/events/23_26/t511-principal-events.ts')
          text = event_path.read_text()
          old = '''  gates: [
              { path: "flags.CONTINENTAL_CONTEXT", op: "eq", value: true },
              { path: "professional.roleSecurity", op: "lte", value: 70 }
            ],'''
          new = '''  gates: [
              { path: "flags.CONTINENTAL_CONTEXT", op: "eq", value: true },
              { path: "flags.CONTINENTAL_REGISTERED", op: "eq", value: false },
              { path: "professional.roleSecurity", op: "lte", value: 70 }
            ],'''
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one EUR gate block, found {text.count(old)}')
          event_path.write_text(text.replace(old, new))

          test_path = Path('scripts/test-t51-t511-23-26.mjs')
          test_text = test_path.read_text()
          old_assert = '''  assert.deepEqual(event.gates, [
              { path: 'flags.CONTINENTAL_CONTEXT', op: 'eq', value: true },
              { path: 'professional.roleSecurity', op: 'lte', value: 70 }
            ]);'''
          new_assert = '''  assert.deepEqual(event.gates, [
              { path: 'flags.CONTINENTAL_CONTEXT', op: 'eq', value: true },
              { path: 'flags.CONTINENTAL_REGISTERED', op: 'eq', value: false },
              { path: 'professional.roleSecurity', op: 'lte', value: 70 }
            ]);'''
          if test_text.count(old_assert) != 1:
              raise SystemExit('Historical T5.11 gate assertion marker not found exactly once')
          test_text = test_text.replace(old_assert, new_assert)
          old_reach = '''  state.professional.roleSecurity = 45;
            assert.equal(eventGatesPass(state, event), true);
            const beforeRegistration = state.flags.CONTINENTAL_REGISTERED;'''
          new_reach = '''  state.professional.roleSecurity = 45;
            assert.equal(eventGatesPass(state, event), true);
            state.flags.CONTINENTAL_REGISTERED = true;
            assert.equal(eventGatesPass(state, event), false, 'already registered players must not receive the unresolved-list scene');
            state.flags.CONTINENTAL_REGISTERED = false;
            const beforeRegistration = state.flags.CONTINENTAL_REGISTERED;'''
          if test_text.count(old_reach) != 1:
              raise SystemExit('Historical T5.11 reachability marker not found exactly once')
          test_path.write_text(test_text.replace(old_reach, new_reach))
          PY

      - name: Build and calculate repaired catalog identity
        id: identity
        run: |
          npm run build
          TARGET=$(node --input-type=module -e "import { EVENTS } from './dist/content/events/index.js'; import { contentIdentity } from './dist/session/content-identity.js'; console.log(await contentIdentity(EVENTS));")
          test "$TARGET" != "88751a2107c035826162968991e3a1808b2f4573afa3a3a20a3efa376fa8af1f"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "TARGET=$TARGET" >> "$GITHUB_ENV"
          echo "Repaired catalog identity: $TARGET"

      - name: Register adjacent E to F same-scene migration
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          target = os.environ['TARGET']
          path = Path('src/session/content-migration.ts')
          text = path.read_text()
          source = '88751a2107c035826162968991e3a1808b2f4573afa3a3a20a3efa376fa8af1f'
          const_line = f'export const T51_EUR_ELIGIBILITY_CONTENT_IDENTITY = "{target}";\n'
          anchor = 'export const T51_PRS_CONTENT_IDENTITY = "88751a2107c035826162968991e3a1808b2f4573afa3a3a20a3efa376fa8af1f";\n'
          if text.count(anchor) != 1:
              raise SystemExit('PRS identity anchor not found exactly once')
          text = text.replace(anchor, anchor + const_line)

          marker = '\n];\n\nconst activeEvidenceCache'
          if text.count(marker) != 1:
              raise SystemExit('Migration route array tail marker not found exactly once')
          route = f'''\n  {{
            sourceContentIdentity: T51_PRS_CONTENT_IDENTITY,
            targetContentIdentity: T51_EUR_ELIGIBILITY_CONTENT_IDENTITY,
            schedulerMappings: [
              {{
                kind: "same_scene",
                legacyEventId: "EVT_23_EUR_001",
                canonicalEventId: "EVT_23_EUR_001"
              }}
            ],
            seedOriginMappings: []
          }}'''
          text = text.replace(marker, ',' + route + marker)
          path.write_text(text)
          print(f'Registered adjacent route {source} -> {target}')
          PY

      - name: Freeze target and regenerate historical evidence
        run: |
          npm run build
          node scripts/freeze-t51-active-source.mjs
          node scripts/generate-t51-post-legacy-registry.mjs
          node scripts/generate-t51-offer-bridge-evidence.mjs

      - name: Add directed E to F regression and wire permanent gates
        run: |
          cat > scripts/test-t51-t511b-eur.mjs <<'EOF'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import test from 'node:test';
          import { createInitialState } from '../dist/content/initial-state.js';
          import { EVENTS_23_26 } from '../dist/content/events/23_26/index.js';
          import { eventGatesPass } from '../dist/narrative/event-gates.js';
          import { contentIdentity } from '../dist/session/content-identity.js';
          import {
            CONTENT_MIGRATION_ROUTES,
            T51_B1A_CONTENT_IDENTITY,
            T51_T510_CONTENT_IDENTITY,
            T51_T511_CONTENT_IDENTITY,
            T51_PRS_CONTENT_IDENTITY,
            T51_EUR_ELIGIBILITY_CONTENT_IDENTITY,
            applyMigrationRouteInPlace,
            findMigrationPath,
            findMigrationRoute
          } from '../dist/session/content-migration.js';
          import { PRE_T51_CONTENT_IDENTITY } from '../dist/session/pre-t51-legacy-registry.js';

          const euro = () => {
            const rows = EVENTS_23_26.filter(event => event.id === 'EVT_23_EUR_001');
            assert.equal(rows.length, 1, 'EVT_23_EUR_001 must have exactly one active definition');
            return rows[0];
          };

          test('T5.11b EUR eligibility fails closed once continental registration is already resolved', () => {
            const event = euro();
            assert.deepEqual(event.gates, [
              { path: 'flags.CONTINENTAL_CONTEXT', op: 'eq', value: true },
              { path: 'flags.CONTINENTAL_REGISTERED', op: 'eq', value: false },
              { path: 'professional.roleSecurity', op: 'lte', value: 70 }
            ]);
            const state = createInitialState(511201);
            state.age = 23;
            state.phase = '23_26';
            state.date = '2026-08-20';
            state.flags.CONTINENTAL_CONTEXT = true;
            state.professional.roleSecurity = 45;
            state.flags.CONTINENTAL_REGISTERED = false;
            assert.equal(eventGatesPass(state, event), true);
            state.flags.CONTINENTAL_REGISTERED = true;
            assert.equal(eventGatesPass(state, event), false);
          });

          test('T5.11b creates only the adjacent E to F same-scene route', async () => {
            const fixturePath = `qa/fixtures/t5.1/post-t51-sources/${T51_EUR_ELIGIBILITY_CONTENT_IDENTITY}.json`;
            const fixture = JSON.parse(fs.readFileSync(fixturePath, 'utf8'));
            assert.equal(await contentIdentity(fixture.events), T51_EUR_ELIGIBILITY_CONTENT_IDENTITY);
            const route = findMigrationRoute(T51_PRS_CONTENT_IDENTITY, T51_EUR_ELIGIBILITY_CONTENT_IDENTITY, CONTENT_MIGRATION_ROUTES);
            assert.ok(route);
            assert.deepEqual(route.seedOriginMappings ?? [], []);
            assert.deepEqual(route.schedulerMappings, [{
              kind: 'same_scene',
              legacyEventId: 'EVT_23_EUR_001',
              canonicalEventId: 'EVT_23_EUR_001'
            }]);
            assert.equal(findMigrationRoute(PRE_T51_CONTENT_IDENTITY, T51_EUR_ELIGIBILITY_CONTENT_IDENTITY, CONTENT_MIGRATION_ROUTES), undefined);
            assert.equal(findMigrationRoute(T51_T511_CONTENT_IDENTITY, T51_EUR_ELIGIBILITY_CONTENT_IDENTITY, CONTENT_MIGRATION_ROUTES), undefined);
            const path = findMigrationPath(PRE_T51_CONTENT_IDENTITY, T51_EUR_ELIGIBILITY_CONTENT_IDENTITY, CONTENT_MIGRATION_ROUTES);
            assert.ok(path);
            assert.deepEqual(path.map(edge => [edge.sourceContentIdentity, edge.targetContentIdentity]), [
              [PRE_T51_CONTENT_IDENTITY, T51_B1A_CONTENT_IDENTITY],
              [T51_B1A_CONTENT_IDENTITY, T51_T510_CONTENT_IDENTITY],
              [T51_T510_CONTENT_IDENTITY, T51_T511_CONTENT_IDENTITY],
              [T51_T511_CONTENT_IDENTITY, T51_PRS_CONTENT_IDENTITY],
              [T51_PRS_CONTENT_IDENTITY, T51_EUR_ELIGIBILITY_CONTENT_IDENTITY]
            ]);
          });

          test('E to F migration never replays a completed EUR scene and preserves cooldown, history and RNG', () => {
            const route = findMigrationRoute(T51_PRS_CONTENT_IDENTITY, T51_EUR_ELIGIBILITY_CONTENT_IDENTITY, CONTENT_MIGRATION_ROUTES);
            assert.ok(route);
            const state = createInitialState(511202);
            state.age = 23;
            state.phase = '23_26';
            state.flags.SEEN_EVT_23_EUR_001 = true;
            state.eventCooldowns.EVT_23_EUR_001 = 777;
            state.history.push({
              eventId: 'EVT_23_EUR_001', date: '2026-08-21', season: state.season,
              choiceId: 'B', outcomeId: 'B_PRIMARY', club: state.club,
              snapshot: { age: 23, family: 'sport' }, salience: 70, visibility: 'private'
            });
            const historyBefore = structuredClone(state.history);
            const rngBefore = structuredClone(state.rngState);
            applyMigrationRouteInPlace(state, route);
            assert.equal(state.flags.SEEN_EVT_23_EUR_001, true);
            assert.equal(state.eventCooldowns.EVT_23_EUR_001, 777);
            assert.deepEqual(state.history, historyBefore);
            assert.deepEqual(state.rngState, rngBefore);
          });

          test('E to F migration leaves unseen EUR available under the repaired eligibility without mutating RNG', () => {
            const route = findMigrationRoute(T51_PRS_CONTENT_IDENTITY, T51_EUR_ELIGIBILITY_CONTENT_IDENTITY, CONTENT_MIGRATION_ROUTES);
            assert.ok(route);
            const state = createInitialState(511203);
            state.age = 23;
            state.phase = '23_26';
            state.flags.SEEN_EVT_23_EUR_001 = false;
            const rngBefore = structuredClone(state.rngState);
            applyMigrationRouteInPlace(state, route);
            assert.equal(state.flags.SEEN_EVT_23_EUR_001, false);
            assert.deepEqual(state.rngState, rngBefore);
          });
          EOF

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          const target = 'scripts/test-t51-t511b-eur.mjs';
          for (const key of ['test', 'qa:t5:saves', 'qa:t5', 'test:t51', 'test:t51:migration']) {
            const command = pkg.scripts[key];
            if (!command.includes(target)) {
              const marker = 'scripts/test-t51-prs-23-26.mjs';
              if (!command.includes(marker)) throw new Error(`${key} is missing ${marker}`);
              pkg.scripts[key] = command.replace(marker, `${marker} ${target}`);
            }
          }
          pkg.scripts['test:t51:t511b'] = `npm run build && node --test ${target}`;
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          NODE

      - name: Document repair generation
        run: |
          cat > project/workstreams/T51_T511B_EUR_ELIGIBILITY.md <<EOF
          # T5.11b — cierre causal de la lista continental

          Base: \\`main@6cb81b63f03ce55776ca97075012cfaa22ac228d\`  
          Rama: \\`integration/t511b-eur-eligibility\`  
          Fuente E: \\`88751a2107c035826162968991e3a1808b2f4573afa3a3a20a3efa376fa8af1f\`  
          Destino F: \\`${TARGET}\`

          ## Corrección

          \\`EVT_23_EUR_001\` conserva copy, choices, outcomes y memoria canónica. La única modificación funcional es añadir el hecho causal \\`flags.CONTINENTAL_REGISTERED == false\` a la eligibility junto con contexto continental y rol no blindado.

          La escena representa incertidumbre previa al cierre de lista; un jugador ya registrado no debe volver a recibirla. Ninguna choice decide la inscripción ni modifica contrato/club.

          ## Migración

          Se añade una única edge adyacente E → F. EUR se declara \\`same_scene\`: no se limpia \\`SEEN\`, no se limpia cooldown y no se reescribe history, journal, provenance, seeds ni RNG. Un pending E conserva su definición/fingerprint E hasta resolverse.

          No existen shortcuts PRE/B1a/C/D → F.

          ## QA

          \\`scripts/test-t51-t511b-eur.mjs\` demuestra:

          - registrado=false puede ser elegible con las demás condiciones satisfechas;
          - registrado=true falla cerrado;
          - E→F es la única edge nueva;
          - el path completo sigue siendo único;
          - una EUR ya resuelta permanece vista y conserva cooldown;
          - una EUR no vista no se suprime artificialmente;
          - migrar consume 0 RNG.

          Fixture F y registries se generan con las herramientas oficiales. La integración final requiere CI exact-head verde y re-ground si \\`main\` avanza.
          EOF

      - name: Directed validation before commit
        run: |
          npm run build
          node scripts/generate-t51-post-legacy-registry.mjs --check
          node scripts/generate-t51-offer-bridge-evidence.mjs --check
          node scripts/freeze-t51-active-source.mjs --check
          node scripts/check-t51-content-migration-route.mjs
          npm run test:t51:t511b
          npm run test:t51:migration

      - name: Commit generated repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/events/23_26/t511-principal-events.ts \
                  src/session/content-migration.ts \
                  src/session/post-t51-legacy-registry.ts \
                  src/session/frozen-offer-bridge-evidence.ts \
                  qa/fixtures/t5.1/post-t51-sources \
                  scripts/test-t51-t511-23-26.mjs \
                  scripts/test-t51-t511b-eur.mjs \
                  package.json \
                  project/workstreams/T51_T511B_EUR_ELIGIBILITY.md
          git commit -m "T5.11b: close EUR registration eligibility gap"
          git push origin HEAD:integration/t511b-eur-eligibility
