name: A5 repair generated K registry

on:
  push:
    branches: ['a0/a5-k-after-317']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a0/a5-k-after-317
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Regenerate post-T5.1 evidence registries
        run: |
          node scripts/generate-t51-post-legacy-registry.mjs
          node scripts/generate-t51-offer-bridge-evidence.mjs
      - name: Persist generated evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/session/post-t51-legacy-registry.ts src/session/frozen-offer-bridge-evidence.ts
          if git diff --cached --quiet; then
            echo "Evidence already current"
            exit 0
          fi
          git commit -m "fix(A5): regenerate K evidence after shared closure"
          git push origin HEAD:a0/a5-k-after-317
