name: Release beta readiness

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  identity-diagnostics:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build engine
        run: npm run build

      - name: Normalize release timestamp
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"

      - name: Generate exact build identity
        env:
          BUILD_GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BUILD_SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: node scripts/release-build-manifest.mjs --require-git

      - name: Test non-mutating diagnostics
        run: node --test scripts/test-release-diagnostics.mjs scripts/test-release-runtime-diagnostics.mjs

      - name: Verify automated upgrade prerequisites
        run: node scripts/release-upgrade-check.mjs

      - name: Verify release metadata
        run: node scripts/release-verify.mjs

      - name: Upload identity evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-identity-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            release/generated/build-manifest.json
            release/generated/release-verification.json
            release/generated/upgrade-check.json
          if-no-files-found: error

  android-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verify hosted Android SDK 36
        shell: bash
        run: |
          test -n "${ANDROID_HOME:-}"
          test -d "$ANDROID_HOME"
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Install dependencies
        run: npm ci

      - name: Build engine
        run: npm run build

      - name: Normalize release timestamp
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"

      - name: Generate exact build identity
        env:
          BUILD_GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BUILD_SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: node scripts/release-build-manifest.mjs --require-git

      - name: Build unsigned technical APK and AAB
        run: node scripts/build-android-release.mjs

      - name: Verify Android candidate
        run: node scripts/release-verify.mjs --android

      - name: Upload Android candidate evidence
        uses: actions/upload-artifact@v4
        with:
          name: android-release-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
            release/generated/build-manifest.json
            release/generated/android-release-report.json
            release/generated/release-verification.json
          if-no-files-found: error
