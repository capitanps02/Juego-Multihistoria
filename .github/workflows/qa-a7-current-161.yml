name: QA A7 #161 current
on:
  push:
    branches:
      - qa/cert-a7-568-161
  pull_request:
    branches:
      - main
jobs:
  captain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test scripts/test-t5-captain-gap-known-bug.mjs
