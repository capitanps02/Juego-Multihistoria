name: Freeze A8 Wave A current successor

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/freeze-a8-wavea-current.yml'
      - 'src/session/content-migration.ts'

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Freeze exact active source
        run: |
          if [ -f qa/fixtures/t5.1/post-t51-sources/b360a1ef1e0d0c19f4600f174bf9d3b2693ed88058a283ed2cdbfaf29d26200b.json ]; then
            node scripts/freeze-t51-active-source.mjs --check
          else
            node scripts/freeze-t51-active-source.mjs
          fi
      - name: Regenerate frozen evidence registries
        run: |
          node scripts/generate-t51-post-legacy-registry.mjs
          node scripts/generate-t51-offer-bridge-evidence.mjs
          npm run build
          node scripts/check-t51-content-migration-route.mjs
      - name: Commit generated freeze evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             qa/fixtures/t5.1/post-t51-sources/b360a1ef1e0d0c19f4600f174bf9d3b2693ed88058a283ed2cdbfaf29d26200b.json             src/session/post-t51-legacy-registry.ts             src/session/frozen-offer-bridge-evidence.ts
          if git diff --cached --quiet; then
            echo "Freeze evidence already current"
          else
            git commit -m "A8 Wave A: freeze exact successor evidence"
            git push origin HEAD:${{ github.head_ref }}
          fi
