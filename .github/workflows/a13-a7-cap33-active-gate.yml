name: A13 A7 CAP33 active factual gate
on:
  pull_request:
permissions:
  contents: read
jobs:
  cap33:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test scripts/test-a11-a7-captain-factual-gate.mjs
