name: T51 A5 K freeze artifacts

on:
  push:
    branches: ['a0/a5-k-b4-after-293']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  freeze:
    if: "!contains(github.event.head_commit.message, 'generated K freeze artifacts')"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a0/a5-k-b4-after-293
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Freeze exact active K catalog
        run: |
          ID=$(node --input-type=module -e "import {EVENTS} from './dist/content/events/index.js'; import {contentIdentity} from './dist/session/content-identity.js'; console.log(await contentIdentity(EVENTS));")
          test "$ID" = "a8fb037f6adb2ea52c862af86cae59c82b23853d7a9940166d732167b3e636a4"
          FILE="qa/fixtures/t5.1/post-t51-sources/$ID.json"
          if [ -f "$FILE" ]; then
            node scripts/freeze-t51-active-source.mjs --check
          else
            node scripts/freeze-t51-active-source.mjs
          fi
          node scripts/generate-t51-post-legacy-registry.mjs
          node scripts/generate-t51-offer-bridge-evidence.mjs
          node scripts/freeze-t51-active-source.mjs --check
      - name: Commit generated evidence only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa/fixtures/t5.1/post-t51-sources/a8fb037f6adb2ea52c862af86cae59c82b23853d7a9940166d732167b3e636a4.json
          git add src/session/post-t51-legacy-registry.ts
          git add src/session/frozen-offer-bridge-evidence.ts
          if git diff --cached --quiet; then
            echo "Generated artifacts already current."
          else
            git commit -m "generated K freeze artifacts"
            git push origin HEAD:a0/a5-k-b4-after-293
          fi
