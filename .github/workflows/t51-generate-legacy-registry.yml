name: T51 generate legacy registry

on:
  push:
    branches: [integration/content-migration-t51]

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate compact legacy registry
        run: node scripts/generate-t51-legacy-registry.mjs
      - name: Verify generated registry
        run: node scripts/generate-t51-legacy-registry.mjs --check
      - name: Commit generated registry
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/session/pre-t51-legacy-registry.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "build(t5.1): generate compact pre-T5.1 legacy registry"
          git push origin HEAD:integration/content-migration-t51
