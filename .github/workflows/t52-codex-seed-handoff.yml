name: T5.2 Codex seed handoff

on:
  push:
    branches:
      - t5/seed-lifecycle-agent2
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Generate lifecycle source
        run: node scripts/audit-t52.mjs

      - name: Generate Codex handoff
        env:
          CODEX_BASE_COMMIT: ${{ github.event.repository.default_branch }}
        run: |
          BASE_SHA="$(git rev-parse origin/main)"
          CODEX_BASE_COMMIT="$BASE_SHA" node scripts/generate-codex-seed-handoff.mjs

      - name: Commit generated handoff when changed
        run: |
          git add analysis/CODEX/seeds/SEED_CONSUMER_MATRIX.json \
                  analysis/CODEX/seeds/implementation-ready.json \
                  analysis/CODEX/seeds/CODEX_PROMPT.md \
                  analysis/CODEX/seeds/SEED_SEMANTICS.md \
                  analysis/CODEX/seeds/UNBLOCKED_CONTENT.md
          if git diff --cached --quiet; then
            echo "Codex seed handoff already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Docs: generate Codex seed implementation handoff"
          git push origin HEAD:t5/seed-lifecycle-agent2
