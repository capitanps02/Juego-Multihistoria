name: T5 CONTRADICTORY 518000 DIAGNOSTIC

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Reproduce contradictory 518000
        run: |
          node --input-type=module <<'NODE'
          import { EVENTS } from './dist/content/events/index.js';
          import { createInitialState } from './dist/content/initial-state.js';
          import { resolveChoiceInPlace } from './dist/narrative/resolver.js';
          import { scheduleEvent } from './dist/narrative/scheduler.js';
          import { advanceWorldDayInPlace } from './dist/simulation/world-simulator.js';
          import { respondToOffer } from './dist/simulation/offers.js';
          import { closeCareer } from './dist/simulation/late-career-engine.js';

          const state=createInitialState(518000);
          let decisions=0, days=0;
          const choose=(event)=>{
            const i=decisions++ % 2===0 ? 0 : event.choices.length-1;
            return event.choices[i].id;
          };
          for(;days<14000;days++){
            if(state.market?.pending) respondToOffer(state,state.market.pending.id,'accept');
            const scheduled=scheduleEvent(state,EVENTS,{qa:true});
            if(scheduled) resolveChoiceInPlace(state,scheduled.event,choose(scheduled.event),true);
            if(state.flags.EARLY_RETIRED_30_34 && state.retirement.status!=='closed') closeCareer(state,'early_retirement_30_34','early_retirement');
            if(state.retirement.status==='closed') break;
            advanceWorldDayInPlace(state);
            if(state.age>=55) break;
          }
          const last=state.history.slice(-40).map(e=>({date:e.date,eventId:e.eventId,choiceId:e.choiceId,age:e.snapshot?.age}));
          const retirementHistory=state.history.filter(e=>/RET|FIN|END/i.test(e.eventId)).slice(-80).map(e=>({date:e.date,eventId:e.eventId,choiceId:e.choiceId,age:e.snapshot?.age}));
          const next=scheduleEvent(state,EVENTS,{qa:true});
          console.log(JSON.stringify({
            final:{date:state.date,age:state.age,phase:state.phase,retirement:state.retirement,flags:{
              RETIREMENT_DECISION_CONTEXT:state.flags.RETIREMENT_DECISION_CONTEXT,
              RETIREMENT_ANNOUNCED:state.flags.RETIREMENT_ANNOUNCED,
              RETIRED:state.flags.RETIRED,
              NO_MARKET_END_CONTEXT:state.flags.NO_MARKET_END_CONTEXT,
              HEALTH_RETIREMENT_CONTEXT:state.flags.HEALTH_RETIREMENT_CONTEXT,
              RETIRE_AFTER_LOW_CONTEXT:state.flags.RETIRE_AFTER_LOW_CONTEXT,
              RETIRE_AFTER_WIN_CONTEXT:state.flags.RETIRE_AFTER_WIN_CONTEXT
            },nextEvent:next?.event?.id??null,days,decisions},
            retirementHistory,last
          },null,2));
          NODE
