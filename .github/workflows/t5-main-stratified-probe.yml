name: T5 CURRENT MAIN STRATIFIED PROBE

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  stratified:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/qa-t5-sim.mjs
