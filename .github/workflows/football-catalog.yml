name: Football catalog

on:
  pull_request:
    paths:
      - 'src/catalog/football/**'
      - 'scripts/test-football-catalog.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/football-catalog.yml'
  workflow_dispatch:

jobs:
  football-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build engine
        run: npm run build
      - name: Validate fictional European football catalog
        run: node --test scripts/test-football-catalog.mjs
