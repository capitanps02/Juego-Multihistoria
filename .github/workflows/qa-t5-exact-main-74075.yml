name: QA T5 exact main 74075
on:
  push:
    branches:
      - qa/t5-exact-main-74075
  pull_request:
    branches:
      - main
jobs:
  blockers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: #61 retirement authority
        run: node --test scripts/test-t5-retirement-authority-known-bug.mjs scripts/test-t5-retirement-save-known-bug.mjs
      - name: #133 LOCK23
        run: node --test scripts/test-t5-lock23-captain-choice-guard.mjs
      - name: #161 captain producer and consumer
        run: node --test scripts/test-t5-captain-gap-known-bug.mjs
