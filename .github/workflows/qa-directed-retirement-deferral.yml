name: QA directed retirement deferral
on:
  push:
    branches:
      - qa/harden-480-retirement-deferral
  pull_request:
    branches:
      - main
jobs:
  directed-deferral:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/test-qa-retirement-deferral-directed.mjs
