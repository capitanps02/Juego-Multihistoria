name: T51 A5 Two-Scene Freeze

on:
  push:
    branches: ['a0/a5-two-scenes-after-shared-bundle']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  freeze-and-certify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Verify exact A5 successor identity
        run: |
          ACTUAL=$(node --input-type=module - <<'NODE'
          import { EVENTS } from './dist/content/events/index.js';
          import { contentIdentity } from './dist/session/content-identity.js';
          process.stdout.write(await contentIdentity(EVENTS));
          NODE
          )
          test "$ACTUAL" = "73591bc91387fc94502f24d80aa48cc2a8e3957a1ad42964cf312c61cbba923d" || { echo "Unexpected target: $ACTUAL"; exit 1; }

      - name: Freeze exact source and regenerate evidence
        run: |
          FIXTURE="qa/fixtures/t5.1/post-t51-sources/73591bc91387fc94502f24d80aa48cc2a8e3957a1ad42964cf312c61cbba923d.json"
          if [ -f "$FIXTURE" ]; then
            node scripts/freeze-t51-active-source.mjs --check
            node scripts/generate-t51-post-legacy-registry.mjs --check
            node scripts/generate-t51-offer-bridge-evidence.mjs --check
          else
            node scripts/freeze-t51-active-source.mjs
            node scripts/generate-t51-post-legacy-registry.mjs
            node scripts/generate-t51-offer-bridge-evidence.mjs
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$FIXTURE" src/session/post-t51-legacy-registry.ts src/session/frozen-offer-bridge-evidence.ts
            git commit -m "freeze(T5.1): A5 representation-market successor 73591bc9"
            git push origin HEAD:a0/a5-two-scenes-after-shared-bundle
          fi

      - name: Rebuild generated evidence
        run: npm run build

      - name: Certify lineage and pending-decision migration
        run: |
          node scripts/freeze-t51-active-source.mjs --check
          node scripts/generate-t51-post-legacy-registry.mjs --check
          node scripts/generate-t51-offer-bridge-evidence.mjs --check
          node scripts/check-t51-content-migration-route.mjs
          node --test scripts/test-t51-content-migration.mjs scripts/test-t51-content-lineage.mjs scripts/test-t51-migration-source-policy.mjs
          node --test scripts/test-t51-a5-representation-ready.mjs scripts/test-t51-a5-market-ready.mjs scripts/test-t51-a5-next-prefreeze.mjs
