name: A18 temporary source freeze artifact

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  generate:
    if: github.head_ref == 'content/a18-3-templates-options'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Generate canonical source artifacts
        run: |
          node scripts/freeze-t51-active-source.mjs
          node scripts/generate-t51-post-legacy-registry.mjs
          node scripts/generate-t51-offer-bridge-evidence.mjs
      - name: Upload generated source artifacts
        uses: actions/upload-artifact@v4
        with:
          name: a18-source-freeze
          if-no-files-found: error
          path: |
            qa/fixtures/t5.1/post-t51-sources/5a047a43e326c7b05144f31f90e080cf5b35777ac47769dcceefd56db0bd80f8.json
            src/session/post-t51-legacy-registry.ts
            src/session/frozen-offer-bridge-evidence.ts
