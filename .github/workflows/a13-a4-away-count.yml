name: A13 A4 factual away-count authority
on:
  pull_request:
permissions:
  contents: read
jobs:
  away-count:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test scripts/test-t5-competition-context.mjs
