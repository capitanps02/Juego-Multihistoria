name: DIAG A6 first5 retirement

on:
  push:
    branches:
      - a0/diag-a6-first5-retirement
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/diag-a6-first5-retirement.mjs
