name: Football Database V2 · Generate deployable artifacts

on:
  pull_request:
    branches: ["db-a7/football-v2-final-certification", main]
    paths:
      - 'src/**'
      - 'web/**'
      - 'scripts/build-playcanvas.mjs'
      - 'scripts/build-android-offline.mjs'
      - 'package.json'
      - '.github/workflows/football-database-v2-generate-artifacts.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build PlayCanvas deployable
        run: npm run build:playcanvas
      - name: Build Android offline deployable
        run: npm run android:offline
      - name: Verify generated packages
        run: node --test scripts/test-playcanvas.mjs scripts/test-android-offline.mjs
      - name: Capture generated diff
        run: |
          git status --short | tee generated-status.txt
          git diff -- playcanvas/multihistoria.js playcanvas/manifest.json web/assets.json android/app/src/main/assets > generated-diff.patch
          git diff --stat -- playcanvas/multihistoria.js playcanvas/manifest.json web/assets.json android/app/src/main/assets > generated-diff-stat.txt
      - name: Commit generated deployables to A8 branch
        if: github.event_name == 'pull_request' && github.head_ref == 'db-a8/football-v2-generated-artifacts'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playcanvas/multihistoria.js playcanvas/manifest.json web/assets.json android/app/src/main/assets
          if git diff --cached --quiet; then
            echo "Generated deployables already synchronized."
          else
            git commit -m "DB-A8: regenerate certified PlayCanvas and Android deployables"
            git fetch origin "$GITHUB_HEAD_REF"
            git rebase "origin/$GITHUB_HEAD_REF"
            git push origin HEAD:"$GITHUB_HEAD_REF"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: football-v2-deployables
          if-no-files-found: error
          retention-days: 7
          path: |
            generated-diff.patch
            generated-diff-stat.txt
            generated-status.txt
            playcanvas/multihistoria.js
            playcanvas/manifest.json
            web/assets.json
            android/app/src/main/assets/**
