name: Football Database V2 · Generate deployable artifacts

on:
  pull_request:
    branches: ["db-a7/football-v2-final-certification", main]
    paths:
      - 'src/**'
      - 'web/**'
      - 'scripts/build-playcanvas.mjs'
      - 'scripts/build-android-offline.mjs'
      - 'package.json'
      - '.github/workflows/football-database-v2-generate-artifacts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build PlayCanvas deployable
        run: npm run build:playcanvas
      - name: Build Android offline deployable
        run: npm run android:offline
      - name: Verify generated packages
        run: node --test scripts/test-playcanvas.mjs scripts/test-android-offline.mjs
      - name: Capture generated diff
        run: |
          git status --short | tee generated-status.txt
          git diff -- playcanvas/multihistoria.js playcanvas/manifest.json web/assets.json android/app/src/main/assets > generated-diff.patch
          git diff --stat -- playcanvas/multihistoria.js playcanvas/manifest.json web/assets.json android/app/src/main/assets > generated-diff-stat.txt
      - uses: actions/upload-artifact@v4
        with:
          name: football-v2-deployables
          if-no-files-found: error
          retention-days: 7
          path: |
            generated-diff.patch
            generated-diff-stat.txt
            generated-status.txt
            playcanvas/multihistoria.js
            playcanvas/manifest.json
            web/assets.json
            android/app/src/main/assets/**
