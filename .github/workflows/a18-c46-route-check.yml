name: A18 C4 C6 Route Check

on:
  push:
    branches:
      - content/a18-3-restack-after-747

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/a18-3-restack-after-747
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Active content migration route
        run: node scripts/check-t51-content-migration-route.mjs
      - name: Directed migration regression
        run: node --test scripts/test-t51-content-migration.mjs
      - name: A5 K semantics and lineage
        run: |
          node --test scripts/test-t51-a5-k.mjs
          node scripts/freeze-t51-active-source.mjs --check
          node scripts/generate-t51-post-legacy-registry.mjs --check
          node scripts/generate-t51-offer-bridge-evidence.mjs --check
