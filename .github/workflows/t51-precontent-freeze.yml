name: T5.1 pre-content freeze

on:
  push:
    branches: [integration/t51-precontent-freeze]

permissions:
  contents: write

jobs:
  freeze:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Generate frozen catalog and manifest
        run: node scripts/freeze-t51-baseline.mjs

      - name: Verify generated baseline
        run: node scripts/freeze-t51-baseline.mjs --check

      - name: Commit immutable fixtures
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa/fixtures/t5.1/pre-t51-event-catalog.json qa/fixtures/t5.1/pre-t51-content-manifest.json
          if git diff --cached --quiet; then
            echo "Freeze fixtures already current"
            exit 0
          fi
          git commit -m "test(t5.1): freeze pre-content catalog [skip ci]"
          git push origin HEAD:integration/t51-precontent-freeze
