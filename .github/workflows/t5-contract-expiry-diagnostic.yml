name: T5 contract expiry diagnostic

on:
  push:
    branches:
      - qa/t5-contract-expiry-diagnostic
    paths:
      - 'scripts/qa-t5-contract-expiry.mjs'
      - '.github/workflows/t5-contract-expiry-diagnostic.yml'
      - 'src/simulation/**'
      - 'src/content/**'
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Reproduce loyal seed 512000
        env:
          T5_CONTRACT_EXPIRY_SEED: '512000'
          T5_CONTRACT_EXPIRY_OUTPUT: 'contract-expiry-512000.json'
        run: node scripts/qa-t5-contract-expiry.mjs
      - name: Upload trace
        uses: actions/upload-artifact@v4
        with:
          name: contract-expiry-512000
          path: contract-expiry-512000.json
