name: T51 A6 Staging After A5

on:
  push:
    branches: ['a0/a6-preactivation-after-496']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staged-a6:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: A6 staged definitions and five-scene preactivation
        run: >-
          node --test
          scripts/test-t51-agent6-lock23.mjs
          scripts/test-t51-agent6-mkt25.mjs
          scripts/test-t51-agent6-offers23-25.mjs
          scripts/test-t51-agent6-age26-bridge.mjs
          scripts/test-t51-agent6-body27.mjs
          scripts/test-t51-agent6-con27.mjs
          scripts/test-t51-agent6-doc26.mjs
          scripts/test-t51-agent6-fin29.mjs
          scripts/test-t51-a6-preactivation.mjs

      - name: A6 L scope proof
        run: node scripts/audit-t52-deferred.mjs && node --test scripts/test-t52-deferred.mjs
