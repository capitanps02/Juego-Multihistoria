name: T5.1 B1a evidence probe

on:
  push:
    branches:
      - integration/t510-after-b1a

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Print B1a evidence delta
        run: |
          node --input-type=module - <<'NODE'
          import { EVENTS } from './dist/content/events/index.js';
          import { buildActiveEventEvidence, T51_B1A_CONTENT_IDENTITY } from './dist/session/content-migration.js';
          const evidence = await buildActiveEventEvidence(EVENTS, T51_B1A_CONTENT_IDENTITY);
          const ids = ['EVT_18_MED_001','EVT_18_TEAM_001','EVT_18_MATCH_002'];
          console.log('B1A_EVIDENCE_DELTA=' + JSON.stringify(Object.fromEntries(ids.map(id => [id, evidence[id]]))));
          NODE
