name: T5.1 Canon 30-34 check

on:
  push:
    branches: ["t51/canon-30-34"]

jobs:
  t51-canon-30-34:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run T5.1 reconciliation tests
        run: npm run test:t51
      - name: Run full regression
        run: npm test
