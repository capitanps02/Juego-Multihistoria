name: A9 final terminal certification
on:
  push:
    branches: [t5/retirement-epilogues]
permissions:
  contents: read
jobs:
  certify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: t5/retirement-epilogues
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Final A8/A9 inventory and terminal invariants
        run: node --test scripts/test-a0-a8-ordinary-final.mjs scripts/test-a9-final-current.mjs
      - name: Current market and retirement authority regressions
        run: node --test scripts/test-t5-market-multi-offer.mjs scripts/test-t5-retirement-authority-known-bug.mjs
      - name: Emit final terminal identity
        run: |
          node --input-type=module <<'NODE'
          import { EVENTS } from './dist/content/events/index.js';
          import { contentIdentity } from './dist/session/content-identity.js';
          const identity=await contentIdentity(EVENTS);
          console.log('A9_FINAL_IDENTITY='+identity);
          console.log('A9_FINAL_EVENTS='+EVENTS.length);
          console.log('A9_FINAL_UNIQUE='+new Set(EVENTS.map(e=>e.id)).size);
          if(EVENTS.length!==388 || new Set(EVENTS.map(e=>e.id)).size!==388) process.exit(1);
          NODE
