name: A0 freeze A8 final
on:
  push:
    branches: [a0/a8-ordinary-final-after-161]
permissions:
  contents: write
jobs:
  freeze:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a0/a8-ordinary-final-after-161
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test scripts/test-a0-a8-ordinary-final.mjs
      - name: Freeze exact A8 final source
        run: |
          if [ -f "qa/fixtures/t5.1/post-t51-sources/ab7c3e62f7ca6d90973e657f2eb0a9cec0a745fe12369ac9df770bcf6614e658.json" ]; then
            node scripts/freeze-t51-active-source.mjs --check
          else
            node scripts/freeze-t51-active-source.mjs
          fi
          node scripts/generate-t51-post-legacy-registry.mjs
          node scripts/generate-t51-offer-bridge-evidence.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "qa/fixtures/t5.1/post-t51-sources/ab7c3e62f7ca6d90973e657f2eb0a9cec0a745fe12369ac9df770bcf6614e658.json" src/session/post-t51-legacy-registry.ts src/session/frozen-offer-bridge-evidence.ts
          if ! git diff --cached --quiet; then
            git commit -m "A0 freeze: serialize A8 final ab7c3e62f7ca"
            git push origin HEAD:a0/a8-ordinary-final-after-161
          fi
