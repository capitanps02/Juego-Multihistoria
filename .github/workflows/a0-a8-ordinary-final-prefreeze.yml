name: A0 A8 ordinary final pre-freeze
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  a8-final:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: A8 final ordinary regression
        run: node --test scripts/test-a0-a8-ordinary-final.mjs
      - name: Emit exact successor identity
        run: |
          node --input-type=module <<'NODE'
          import { EVENTS } from './dist/content/events/index.js';
          import { contentIdentity } from './dist/session/content-identity.js';
          const identity=await contentIdentity(EVENTS);
          console.log('A8_FINAL_IDENTITY='+identity);
          console.log('A8_FINAL_EVENTS='+EVENTS.length);
          console.log('A8_FINAL_UNIQUE='+new Set(EVENTS.map(e=>e.id)).size);
          if(EVENTS.length!==388 || new Set(EVENTS.map(e=>e.id)).size!==388) process.exit(1);
          NODE
