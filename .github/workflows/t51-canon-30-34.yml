name: T5.1 canon 30-34

on:
  pull_request:
    branches: [main]
    paths:
      - 'analysis/T5.1/canon-30-34*.json'
      - 'project/workstreams/T51_CANON_30_34.md'
      - 'scripts/test-t51-30-34-*.mjs'
      - 'src/content/events/30_34/**'
      - '.github/workflows/t51-canon-30-34.yml'
  workflow_dispatch:

jobs:
  focused-veteran-canon:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Diagnose active EVENTS drift from previous green catalog
        run: |
          git worktree add /tmp/t51-old 3dd9fd463a7cbef0093f6b0d87c14b6991d8e522
          cd /tmp/t51-old
          npm ci
          npm run build
          cd "$GITHUB_WORKSPACE"
          node --input-type=module <<'NODE'
          import { pathToFileURL } from 'node:url';
          const current = (await import(pathToFileURL(`${process.cwd()}/dist/content/events/index.js`))).EVENTS;
          const previous = (await import(pathToFileURL('/tmp/t51-old/dist/content/events/index.js'))).EVENTS;
          const prev = new Map(previous.map(event => [event.id, event]));
          const cur = new Map(current.map(event => [event.id, event]));
          const ids = [...new Set([...prev.keys(), ...cur.keys()])].sort();
          let count = 0;
          for (const id of ids) {
            const a = prev.get(id);
            const b = cur.get(id);
            if (JSON.stringify(a) === JSON.stringify(b)) continue;
            count += 1;
            console.log(`\n=== ${id} ===`);
            console.log('PREVIOUS', JSON.stringify(a));
            console.log('CURRENT ', JSON.stringify(b));
          }
          console.log(`\nDIFFERING_EVENTS=${count}`);
          NODE

      - name: Validate 30-34 canon, authority and migration handoff
        run: >-
          node --test
          scripts/test-t51-30-34-trigger.mjs
          scripts/test-t51-30-34-career-authority.mjs
          scripts/test-t51-30-34-authority-gaps.mjs
          scripts/test-t51-30-34-sport-authority.mjs
          scripts/test-t51-30-34-seed-handoff.mjs
          scripts/test-t51-30-34-downstream-seed-handoff.mjs
          scripts/test-t51-30-34-seed-consumption.mjs
          scripts/test-t51-30-34-conditional-seed-reads.mjs
          scripts/test-t51-30-34-readiness.mjs
          scripts/test-t51-30-34-migration-handoff.mjs
