name: T5.1 30-34 final evidence

on:
  push:
    branches: [t51/canon-30-34]
    paths:
      - '.github/workflows/t51-30-34-final-evidence.yml'

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: t51/canon-30-34
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Refresh evidence text
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const MAIN_SHA = '30ae3f27ddcb846f59f049e3a4536276f3e9a97e';
          const SOURCE = 'fee2ff875bac7979d3907f5ee1004ef736efa9a257237c6dee629dd8687fe136';
          const TARGET = 'b7483243816fd4e2e8cf1774a4ece699f47b6a03637de50c31347109512f4446';
          const runId = Number(process.env.RUN_ID);

          const handoffPath = 'analysis/T5.1/canon-30-34-migration-handoff.json';
          const handoff = JSON.parse(fs.readFileSync(handoffPath, 'utf8'));
          handoff.sourceMainSha = MAIN_SHA;
          handoff.sourceContentIdentity = SOURCE;
          handoff.observedTargetContentIdentity = TARGET;
          handoff.targetIdentityEvidence.workflowRun = runId;
          handoff.targetIdentityEvidence.source = 'T5.1 30-34 final evidence / runtime contentIdentity(EVENTS) on current main tip';
          fs.writeFileSync(handoffPath, JSON.stringify(handoff, null, 2) + '\n');

          const auditPath = 'analysis/T5.1/canon-30-34.json';
          const audit = JSON.parse(fs.readFileSync(auditPath, 'utf8'));
          audit.integrationStatus.syncedBaselineMain = MAIN_SHA;
          audit.integrationStatus.targetedT51Run = runId;
          audit.integrationStatus.targetedT51Result = 'pending_final_evidence';
          audit.integrationStatus.temporaryValidationWorkflowRemoved = false;
          fs.writeFileSync(auditPath, JSON.stringify(audit, null, 2) + '\n');

          const workstreamPath = 'project/workstreams/T51_CANON_30_34.md';
          let workstream = fs.readFileSync(workstreamPath, 'utf8');
          workstream = workstream.replace(/Baseline sincronizado: `main@[0-9a-f]+`\./, `Baseline sincronizado: \`main@${MAIN_SHA}\`.`);
          workstream = workstream.replace(
            /La infraestructura global ya preserva el lineage `PRE_T51 → T51_B1A`\.[\s\S]*?no se reescribe desde este workstream\.\n\n/,
            `La infraestructura global preserva el lineage \`PRE_T51 → T51_B1A → T5.10 (fee2ff87…)\`. El boundary actual de 30–34 es \`fee2ff87… → b7483243…\`: integración debe congelar primero el target y registrar después el edge con los 27 \`distinct_scene\`. Los dos tests compartidos T5.10 que todavía tratan \`fee2ff87…\` como runtime final se mantienen como dependencia global caracterizada; este workstream no modifica el bloque 23–26.\n\n`
          );
          workstream = workstream.replace('- `targetedT51Result: 29/29_pass`;', '- `targetedT51Result: 30_34_plus_b1a_focused_pass`;');
          const marker = 'Evidencia dirigida:\n';
          const line = `\n- run \`${runId}\`: gate final sobre \`main@${MAIN_SHA.slice(0, 8)}…\` en curso; revalida 30–34+B1a, offer bridge, deuda T5.10 y boundary de freeze \`b7483243…\`.\n`;
          if (!workstream.includes(`run \`${runId}\``)) workstream = workstream.replace(marker, marker + line);
          fs.writeFileSync(workstreamPath, workstream);
          NODE
      - run: npm ci
      - run: npm run build
      - name: Validate 30-34 and historical B1a
        run: npm run audit:t51 && node --test scripts/test-t51.mjs scripts/test-t51-b1a-intel.mjs scripts/test-t51-30-34-trigger.mjs scripts/test-t51-30-34-readiness.mjs scripts/test-t51-30-34-migration-handoff.mjs
      - name: Validate offer/session bridge
        run: npm run test:t51:offer-bridge
      - name: Reproduce only known T5.10 downstream-lineage debt
        run: |
          set +e
          node --test scripts/test-t51-t510-23-26.mjs > /tmp/t510.log 2>&1
          code=$?
          set -e
          cat /tmp/t510.log
          test "$code" -ne 0
          grep -q 'T5.10 extends the lineage PRE -> B1a -> T5.10 with no direct shortcut' /tmp/t510.log
          grep -q 'real B1a and pre-T5.1 Session v3 snapshots both migrate to T5.10 without RNG drift' /tmp/t510.log
          grep -q 'fee2ff875bac7979d3907f5ee1004ef736efa9a257237c6dee629dd8687fe136' /tmp/t510.log
          grep -q 'b7483243816fd4e2e8cf1774a4ece699f47b6a03637de50c31347109512f4446' /tmp/t510.log
      - name: Reproduce only expected target-freeze boundary
        run: |
          set +e
          node scripts/check-t51-content-migration-route.mjs > /tmp/route.log 2>&1
          code=$?
          set -e
          cat /tmp/route.log
          test "$code" -ne 0
          grep -q 'b7483243816fd4e2e8cf1774a4ece699f47b6a03637de50c31347109512f4446' /tmp/route.log
          grep -q 'has no frozen source evidence' /tmp/route.log
      - name: Finalize and self-remove
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const runId = Number(process.env.RUN_ID);
          const auditPath = 'analysis/T5.1/canon-30-34.json';
          const audit = JSON.parse(fs.readFileSync(auditPath, 'utf8'));
          audit.integrationStatus.targetedT51Run = runId;
          audit.integrationStatus.targetedT51Result = '30_34_plus_b1a_focused_pass';
          audit.integrationStatus.offerSessionBridgeValidation = 'pass';
          audit.integrationStatus.sharedT510Test = 'known_downstream_lineage_stale_2_tests';
          audit.integrationStatus.contentMigrationChecker = 'expected_missing_target_freeze_before_route_registration';
          audit.integrationStatus.temporaryValidationWorkflowRemoved = true;
          fs.writeFileSync(auditPath, JSON.stringify(audit, null, 2) + '\n');

          const workstreamPath = 'project/workstreams/T51_CANON_30_34.md';
          let workstream = fs.readFileSync(workstreamPath, 'utf8');
          const pendingPrefix = `- run \`${runId}\`: gate final`;
          const finalLine = `- run \`${runId}\`: **PASS** final sobre \`main@30ae3f27…\`: 30–34+B1a histórico PASS, offer/session bridge PASS, dos tests T5.10 shared reproducidos como deuda lineage-stale y checker detenido únicamente por el freeze \`b7483243…\`.`;
          workstream = workstream.split('\n').map(line => line.startsWith(pendingPrefix) ? finalLine : line).join('\n');
          fs.writeFileSync(workstreamPath, workstream);
          NODE
          rm .github/workflows/t51-30-34-final-evidence.yml
      - name: Commit validated evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/T5.1/canon-30-34-migration-handoff.json analysis/T5.1/canon-30-34.json project/workstreams/T51_CANON_30_34.md .github/workflows/t51-30-34-final-evidence.yml
          git commit -m 'audit(t51): finalize 30-34 evidence on current main tip'
          git push origin HEAD:t51/canon-30-34
