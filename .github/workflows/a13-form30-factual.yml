name: A13 factual FORM30
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: FORM30 factual gate regression
        run: node --test scripts/test-a13-a7-form30-factual.mjs
