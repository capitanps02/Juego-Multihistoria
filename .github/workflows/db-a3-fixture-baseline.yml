name: DB-A3 fixture baseline

on:
  push:
    branches:
      - db-a3/football-runtime-integration
  pull_request:
    paths:
      - 'src/simulation/match-model.ts'
      - 'scripts/test-db-a3-fixture-baseline.mjs'
      - '.github/workflows/db-a3-fixture-baseline.yml'

jobs:
  fixture-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test scripts/test-db-a3-fixture-baseline.mjs
