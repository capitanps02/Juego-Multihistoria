name: T51 23-26 readiness validation

on:
  push:
    branches: [t51/canon-23-30]

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Validate canonical cards
        run: node --test scripts/test-t51-canon-23-26-cards.mjs
      - name: Validate implementation readiness
        run: node --test scripts/test-t51-canon-23-26-readiness.mjs
      - name: Regression gate
        run: npm test
