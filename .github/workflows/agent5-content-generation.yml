name: Agent 5 content generation H

on:
  push:
    branches: [t51/canon-18-23-agent5]

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Agent 5 branch
        uses: actions/checkout@v4
        with:
          ref: t51/canon-18-23-agent5
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build re-grounded active catalog
        run: npm run build

      - name: Compute exact Agent 5 target identity
        shell: bash
        run: |
          set -euo pipefail
          TARGET_IDENTITY=$(node --input-type=module <<'NODE'
          import { EVENTS } from './dist/content/events/index.js';
          import { contentIdentity } from './dist/session/content-identity.js';
          console.log(await contentIdentity(EVENTS));
          NODE
          )
          test -n "$TARGET_IDENTITY"
          test "$TARGET_IDENTITY" != "303527efcc42c17e502257c3d7c613facafa10c8ed113810b64a1d7ebc6d0bb1"
          echo "TARGET_IDENTITY=$TARGET_IDENTITY" >> "$GITHUB_ENV"
          echo "Agent 5 target identity: $TARGET_IDENTITY"

      - name: Register adjacent G-to-Agent5 edge
        shell: python
        run: |
          import os
          from pathlib import Path

          p = Path('src/session/content-migration.ts')
          text = p.read_text()
          marker = 'T51_AGENT5_18_23_CONTENT_IDENTITY'
          source = '303527efcc42c17e502257c3d7c613facafa10c8ed113810b64a1d7ebc6d0bb1'
          target = os.environ['TARGET_IDENTITY']

          assert marker not in text, 'Agent 5 marker must be absent after re-ground'
          constant_anchor = f'export const T51_PRS_CAUSAL_CONTENT_IDENTITY = "{source}";\n'
          assert constant_anchor in text
          text = text.replace(
              constant_anchor,
              constant_anchor + f'export const {marker} = "{target}";\n',
              1
          )

          ids = [
              'EVT_20_LIFE_001',
              'EVT_20_ABR_001',
              'EVT_21_RIV_001',
              'CEVT_21_ABR_01',
              'CEVT_21_MEDIA_01',
              'EVT_21_CAP_001',
              'EVT_21_PRS_001',
              'EVT_22_CON_001',
              'EVT_22_CON_002',
              'EVT_20_STATUS_001',
              'EVT_20_LOCK_001',
              'EVT_20_LOCK_002'
          ]
          mappings = ',\n'.join(
              '      { kind: "distinct_scene", legacyEventId: "' + event_id + '", canonicalEventId: "' + event_id + '", clearCanonicalSeen: true, clearCanonicalCooldown: true }'
              for event_id in ids
          )
          edge = f'''  {{\n    sourceContentIdentity: T51_PRS_CAUSAL_CONTENT_IDENTITY,\n    targetContentIdentity: {marker},\n    schedulerMappings: [\n{mappings}\n    ],\n    seedOriginMappings: []\n  }}'''

          routes_start = text.index('export const CONTENT_MIGRATION_ROUTES')
          routes_end = text.index('\n];', routes_start)
          before = text[:routes_end].rstrip()
          assert before.endswith('}')
          text = before + ',\n' + edge + text[routes_end:]
          p.write_text(text)

          final = p.read_text()
          assert f'export const {marker} = "{target}";' in final
          assert final.count(f'targetContentIdentity: {marker}') == 1
          print(f'Registered adjacent Agent 5 generation {source} -> {target}')

      - name: Build registered generation
        run: npm run build

      - name: Verify compiled adjacent route
        run: |
          node --input-type=module <<'NODE'
          import { EVENTS } from './dist/content/events/index.js';
          import { contentIdentity } from './dist/session/content-identity.js';
          import {
            CONTENT_MIGRATION_ROUTES,
            findMigrationPath,
            T51_PRS_CAUSAL_CONTENT_IDENTITY,
            T51_AGENT5_18_23_CONTENT_IDENTITY
          } from './dist/session/content-migration.js';
          const active = await contentIdentity(EVENTS);
          if (active !== T51_AGENT5_18_23_CONTENT_IDENTITY) throw new Error(`Target constant ${T51_AGENT5_18_23_CONTENT_IDENTITY} != active ${active}`);
          const edge = CONTENT_MIGRATION_ROUTES.find(route =>
            route.sourceContentIdentity === T51_PRS_CAUSAL_CONTENT_IDENTITY &&
            route.targetContentIdentity === T51_AGENT5_18_23_CONTENT_IDENTITY
          );
          if (!edge) throw new Error('Compiled G -> Agent 5 migration edge missing');
          if ((edge.schedulerMappings ?? []).length !== 12) throw new Error(`Expected 12 Agent 5 scheduler mappings, got ${(edge.schedulerMappings ?? []).length}`);
          const path = findMigrationPath(T51_PRS_CAUSAL_CONTENT_IDENTITY, T51_AGENT5_18_23_CONTENT_IDENTITY);
          if (!path || path.length !== 1) throw new Error('Agent 5 adjacent migration path is not uniquely one edge');
          console.log(JSON.stringify({ ok: true, source: T51_PRS_CAUSAL_CONTENT_IDENTITY, target: active, schedulerMappings: edge.schedulerMappings.length }));
          NODE

      - name: Freeze exact active Agent 5 source
        run: node scripts/freeze-t51-active-source.mjs

      - name: Regenerate historical evidence
        run: |
          node scripts/generate-t51-post-legacy-registry.mjs
          node scripts/generate-t51-offer-bridge-evidence.mjs

      - name: Validate full repository gates
        run: npm test

      - name: Validate Agent 5 focused suites
        run: node --test scripts/test-t51-agent11-18-20.mjs scripts/test-t51-early-seed-consumers.mjs scripts/test-t51-t55a-20-23.mjs scripts/test-t51-t55b-20-23.mjs scripts/test-t51-t56a-20-23.mjs

      - name: Commit generated Agent 5 generation H
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/session/content-migration.ts \
            "qa/fixtures/t5.1/post-t51-sources/${TARGET_IDENTITY}.json" \
            src/session/post-t51-legacy-registry.ts \
            src/session/frozen-offer-bridge-evidence.ts
          git diff --cached --quiet && { echo "Expected generated evidence changes"; exit 1; }
          git commit -m "T5.1: register Agent 5 generation H"
          git push origin HEAD:t51/canon-18-23-agent5
