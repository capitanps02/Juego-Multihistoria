name: A0 A9 terminal final
on:
  push:
    branches:
      - a0/a9-terminal-final
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  terminal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: A9 finite terminal matrix
        run: |
          node --test scripts/test-t536-canonical-accreditation.mjs
          node --test scripts/test-t536-terminal-seeds.mjs
          node --test scripts/test-t536-retirement-reversal.mjs
          node --test scripts/test-t536-t537-retirement.mjs
          node --test scripts/test-t536-status-writer-inventory.mjs
          node --test scripts/test-t536-career-summary.mjs
          node --test scripts/test-t536-no-last-match-authority.mjs
      - name: Exact terminal identity
        run: |
          node --input-type=module <<'NODE'
          import { EVENTS } from './dist/content/events/index.js';
          import { contentIdentity } from './dist/session/content-identity.js';
          console.log('A9_FINAL_IDENTITY='+await contentIdentity(EVENTS));
          console.log('A9_FINAL_EVENTS='+EVENTS.length);
          console.log('A9_FINAL_UNIQUE='+new Set(EVENTS.map(e=>e.id)).size);
          if(EVENTS.length!==388 || new Set(EVENTS.map(e=>e.id)).size!==388) process.exit(1);
          NODE
